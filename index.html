<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ybible</title>

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ybible" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- JSZip & Lucide Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --font-serif: "Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --highlight: #e0f2fe;
      --bible-font-size: 16.5px;
    }

    [data-theme="dark"] {
      --bg-main: #090d16;
      --bg-card: #131b2e;
      --bg-subtle: #1e293b;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --highlight: #1e3a5f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1열: 작업표시줄 */
    .top-toolbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
    }

    .tool-group-left, .tool-group-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      height: 36px;
      padding: 0 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .tool-btn.btn-ai {
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .tool-btn.icon-only {
      width: 36px;
      padding: 0;
    }

    .install-badge-btn {
      background: #059669;
      color: #fff;
      border: none;
      display: none; /* PWA 설치 가능 시 자동 노출 */
      gap: 4px;
      font-size: 13px;
    }

    /* 2열: 성경 책, 장, 절 선택 */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    select {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    /* 3열: 역본 비교대조 작업표시줄 */
    .version-compare-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 10;
    }

    .version-chip {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .version-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* 화면 슬라이딩 뷰포트 */
    .slider-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .screen-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 14px 10px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #bibleScreen {
      transform: translateX(0);
    }

    #bibleScreen.slide-out {
      transform: translateX(-100%);
    }

    #aiScreen {
      transform: translateX(100%);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    #aiScreen.slide-in {
      transform: translateX(0);
    }

    /* 구절 렌더링 스타일 */
    .verse-item {
      padding: 6px 4px;
      border-radius: 6px;
      margin-bottom: 3px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
    }

    .verse-item.selected {
      background: var(--highlight);
    }

    .verse-num {
      color: var(--primary);
      font-weight: 700;
      font-size: calc(var(--bible-font-size) - 2px);
      min-width: 18px;
      text-align: right;
      user-select: none;
      flex-shrink: 0;
    }

    .verse-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .verse-line {
      font-size: var(--bible-font-size);
      line-height: 1.75;
      font-weight: 500;
      word-break: break-all;
    }

    .verse-line.lang-en {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .compare-tag {
      font-size: 11px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
      font-weight: 600;
    }

    /* AI 응답 화면 */
    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .ai-result-body {
      flex: 1;
      overflow-y: auto;
      font-size: 15.5px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: 10px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- 1열: 작업표시줄 -->
  <header class="top-toolbar">
    <div class="tool-group-left">
      <!-- 4. Ai 버튼 -->
      <button class="tool-btn btn-ai" id="aiBtn" title="선택 구절 해설">Ai</button>
      <!-- 2. 다크/데이모드 토글 -->
      <button class="tool-btn icon-only" id="themeBtn" title="화면 모드 전환">
        <i id="themeIcon" data-lucide="moon" style="width:18px;height:18px;"></i>
      </button>
      <!-- 3. 설정 (역본 삭제) -->
      <button class="tool-btn icon-only" id="settingsBtn" title="설정 및 역본 관리">
        <i data-lucide="settings" style="width:18px;height:18px;"></i>
      </button>
      <!-- 4. '+' LFA 성경 설치 -->
      <input type="file" id="lfaFileInput" accept="*/*" style="display:none;" />
      <button class="tool-btn icon-only" onclick="document.getElementById('lfaFileInput').click()" title="성경 파일 추가">+</button>
    </div>
    <div class="tool-group-right">
      <!-- 앱 설치 버튼 -->
      <button class="tool-btn install-badge-btn" id="pwaInstallBtn">
        <i data-lucide="download" style="width:16px;height:16px;"></i> 앱 설치
      </button>
    </div>
  </header>

  <!-- 2열: 책, 장, 절 선택 -->
  <nav class="nav-bar">
    <select id="bookSelect"></select>
    <select id="chapterSelect"></select>
    <select id="verseSelect"></select>
  </nav>

  <!-- 5열: 각 설치된 역본 선택 및 비교대조 바 -->
  <div class="version-compare-bar" id="versionCompareBar"></div>

  <!-- 본문 / AI 전환 슬라이더 -->
  <div class="slider-viewport">
    <!-- 성경 창 -->
    <main class="screen-panel" id="bibleScreen">
      <div id="versesContainer"></div>
    </main>

    <!-- AI 해설 창 -->
    <section class="screen-panel" id="aiScreen">
      <div class="ai-header">
        <h3 id="aiTitle" style="font-size:16px;font-weight:700;">구절 해설</h3>
        <button class="tool-btn" id="aiBackBtn" style="gap:4px;">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> 성경으로 돌아가기
        </button>
      </div>
      <div class="ai-result-body" id="aiResultText">해설을 불러오는 중입니다...</div>
    </section>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="font-size:16px;font-weight:700;">역본 관리 및 삭제</h3>
        <button onclick="document.getElementById('settingsModal').style.display='none'" style="background:none;border:none;cursor:pointer;font-size:18px;">&times;</button>
      </div>
      <div id="settingsTransList"></div>
    </div>
  </div>

  <script>
    // --- PWA Service Worker & Install Prompt ---
    let deferredPrompt = null;
    const installBtn = document.getElementById('pwaInstallBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
      lucide.createIcons();
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });

    // --- 성경 데이터베이스 및 기본 구조 ---
    const BIBLE_BOOKS = [
      "창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하",
      "열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언",
      "전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스",
      "오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기",
      "마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서",
      "빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서",
      "야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"
    ];

    let db;
    let currentBook = 0;
    let currentChapter = 1;
    let activeTranslations = [];
    let selectedVerseKey = null;
    let selectedVerseText = "";

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("YbibleDB", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("translations")) d.createObjectStore("translations", { keyPath: "id" });
          if (!d.objectStoreNames.contains("verses")) {
            const store = d.createObjectStore("verses", { keyPath: "id" });
            store.createIndex("query_idx", ["translationId", "book", "chapter"], { unique: false });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = reject;
      });
    }

    // --- UI 초기화 ---
    function initSelectors() {
      const bSel = document.getElementById("bookSelect");
      bSel.innerHTML = "";
      BIBLE_BOOKS.forEach((b, i) => {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = b;
        bSel.appendChild(opt);
      });

      bSel.onchange = (e) => {
        currentBook = parseInt(e.target.value);
        currentChapter = 1;
        updateChapterSelect();
        renderVerses();
      };

      updateChapterSelect();
      document.getElementById("chapterSelect").onchange = (e) => {
        currentChapter = parseInt(e.target.value);
        updateVerseSelect();
        renderVerses();
      };

      document.getElementById("verseSelect").onchange = (e) => {
        const v = parseInt(e.target.value);
        if (v > 0) {
          const el = document.querySelector(`.verse-item[data-verse="${v}"]`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
    }

    function updateChapterSelect() {
      const cSel = document.getElementById("chapterSelect");
      cSel.innerHTML = "";
      for (let i = 1; i <= 50; i++) {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = `${i}장`;
        cSel.appendChild(opt);
      }
      updateVerseSelect();
    }

    function updateVerseSelect() {
      const vSel = document.getElementById("verseSelect");
      vSel.innerHTML = "";
      for (let i = 1; i <= 40; i++) {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = `${i}절`;
        vSel.appendChild(opt);
      }
    }

    // --- 역본 관리 및 비교대조 바 렌더링 ---
    async function updateVersionBar() {
      const bar = document.getElementById("versionCompareBar");
      bar.innerHTML = "";
      const tx = db.transaction("translations", "readonly");
      const list = await new Promise(res => {
        const req = tx.objectStore("translations").getAll();
        req.onsuccess = () => res(req.result);
      });

      if (list.length > 0 && activeTranslations.length === 0) {
        activeTranslations = [list[0].id];
      }

      list.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "version-chip" + (activeTranslations.includes(item.id) ? " active" : "");
        chip.textContent = item.name;
        chip.onclick = () => {
          if (activeTranslations.includes(item.id)) {
            if (activeTranslations.length > 1) {
              activeTranslations = activeTranslations.filter(id => id !== item.id);
            }
          } else {
            activeTranslations.push(item.id);
          }
          updateVersionBar();
          renderVerses();
        };
        bar.appendChild(chip);
      });
    }

    // --- 본문 렌더링 및 절 선택 ---
    async function renderVerses() {
      const container = document.getElementById("versesContainer");
      container.innerHTML = "";
      selectedVerseKey = null;

      const tx = db.transaction("verses", "readonly");
      const store = tx.objectStore("verses");
      const index = store.index("query_idx");

      const map = new Map();
      for (const tId of activeTranslations) {
        const range = IDBKeyRange.only([tId, currentBook, currentChapter]);
        await new Promise(res => {
          index.getAll(range).onsuccess = (e) => {
            e.target.result.forEach(r => {
              if (!map.has(r.verse)) map.set(r.verse, {});
              map.get(r.verse)[tId] = r.text;
            });
            res();
          };
        });
      }

      const sorted = Array.from(map.keys()).sort((a,b)=>a-b);
      if (sorted.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:30px;'>+ 버튼을 눌러 성경 파일(.lfa)을 추가해 주세요.</p>";
        return;
      }

      sorted.forEach(vNum => {
        const item = document.createElement("div");
        item.className = "verse-item";
        item.dataset.verse = vNum;

        let contentHtml = "";
        activeTranslations.forEach(tId => {
          const text = map.get(vNum)[tId] || "";
          const isEn = /[a-zA-Z]/.test(text) && !/[가-힣]/.test(text);
          contentHtml += `<div class="verse-line ${isEn?'lang-en':''}">${activeTranslations.length>1?`<span class="compare-tag">${tId}</span>`:''}${text}</div>`;
        });

        item.innerHTML = `<div class="verse-num">${vNum}</div><div class="verse-content-box">${contentHtml}</div>`;
        item.onclick = () => {
          document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          selectedVerseKey = `${BIBLE_BOOKS[currentBook]} ${currentChapter}:${vNum}`;
          selectedVerseText = item.querySelector('.verse-content-box').textContent;
        };
        container.appendChild(item);
      });
    }

    // --- AI 화면 슬라이딩 전환 ---
    document.getElementById("aiBtn").onclick = () => {
      if (!selectedVerseKey) {
        alert("해설을 보실 성경 구절을 먼저 선택해 주세요.");
        return;
      }

      document.getElementById("aiTitle").textContent = `${selectedVerseKey} 해설`;
      document.getElementById("aiResultText").textContent = "해설을 생성 중입니다...";

      document.getElementById("bibleScreen").classList.add("slide-out");
      document.getElementById("aiScreen").classList.add("slide-in");

      // 목업 해설 생성
      setTimeout(() => {
        document.getElementById("aiResultText").textContent = 
          `[${selectedVerseKey} 본문 해설]\n\n` +
          `1. 핵심 의미:\n본 구절은 하나님의 주권과 구속사적 맥락에서 중요한 의미를 지닙니다.\n\n` +
          `2. 원어 및 배경 묵상:\n원문의 뉘앙스는 언약적 신실하심을 증언하며 성도의 순종을 요청합니다.`;
      }, 500);
    };

    document.getElementById("aiBackBtn").onclick = () => {
      document.getElementById("bibleScreen").classList.remove("slide-out");
      document.getElementById("aiScreen").classList.remove("slide-in");
    };

    // --- 테마 전환 ---
    document.getElementById("themeBtn").onclick = () => {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      document.getElementById("themeIcon").setAttribute("data-lucide", next === "dark" ? "sun" : "moon");
      lucide.createIcons();
    };

    // --- 설정 모달 (역본 삭제) ---
    document.getElementById("settingsBtn").onclick = async () => {
      const listEl = document.getElementById("settingsTransList");
      listEl.innerHTML = "";
      const tx = db.transaction("translations", "readonly");
      tx.objectStore("translations").getAll().onsuccess = (e) => {
        const list = e.target.result;
        list.forEach(item => {
          const row = document.createElement("div");
          row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-color);";
          row.innerHTML = `<span>${item.name}</span><button style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">삭제</button>`;
          row.querySelector("button").onclick = () => deleteTranslation(item.id, item.name);
          listEl.appendChild(row);
        });
        document.getElementById("settingsModal").style.display = "flex";
      };
    };

    async function deleteTranslation(id, name) {
      if (!confirm(`'${name}' 역본을 삭제하시겠습니까?`)) return;
      const tx = db.transaction(["translations", "verses"], "readwrite");
      tx.objectStore("translations").delete(id);
      activeTranslations = activeTranslations.filter(t => t !== id);
      tx.oncomplete = () => {
        document.getElementById("settingsModal").style.display = "none";
        updateVersionBar();
        renderVerses();
      };
    }

    // --- LFA 파일 파서 엔진 ---
    document.getElementById("lfaFileInput").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const buffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(buffer);
        const transId = file.name.replace(/\.[^/.]+$/, "").toUpperCase();
        const verses = [];

        for (const filename of Object.keys(zip.files)) {
          const match = filename.match(/(\d{1,2})[_\-](\d{1,3})\.lfb$/i);
          if (match) {
            const bIdx = parseInt(match[1], 10) - 1;
            const ch = parseInt(match[2], 10);
            if (bIdx >= 0 && bIdx < 66) {
              const uint8 = await zip.files[filename].async("uint8array");
              const text = new TextDecoder("euc-kr").decode(uint8);
              const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
              lines.forEach((line, vIdx) => {
                const clean = line.replace(/^[가-힣a-zA-Z0-9\s]{1,15}\s*\d+[:\.\s_]\d+[\s\t]*/, '').trim();
                verses.push({
                  id: `${transId}_${bIdx}_${ch}_${vIdx+1}`,
                  translationId: transId,
                  book: bIdx,
                  chapter: ch,
                  verse: vIdx + 1,
                  text: clean
                });
              });
            }
          }
        }

        const tx = db.transaction(["translations", "verses"], "readwrite");
        tx.objectStore("translations").put({ id: transId, name: transId });
        const vStore = tx.objectStore("verses");
        verses.forEach(v => vStore.put(v));
        tx.oncomplete = () => {
          alert(`'${transId}' 역본이 성공적으로 등록되었습니다.`);
          updateVersionBar();
          renderVerses();
        };
      } catch (err) {
        alert("파싱 중 오류가 발생했습니다: " + err.message);
      }
    };

    window.onload = async () => {
      await initDB();
      initSelectors();
      await updateVersionBar();
      renderVerses();
      lucide.createIcons();
    };
  </script>
</body>
</html>
