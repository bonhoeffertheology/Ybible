<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ybible</title>

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ybible" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- JSZip & Lucide Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --highlight: #e0f2fe;
      --bible-font-size: 16.5px;
    }

    [data-theme="dark"] {
      --bg-main: #090d16;
      --bg-card: #131b2e;
      --bg-subtle: #1e293b;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --highlight: #1e3a5f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: pan-x pan-y;
    }

    /* 1열: 작업표시줄 */
    .top-toolbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
    }

    .tool-group-left, .tool-group-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn {
      height: 34px;
      padding: 0 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .tool-btn.btn-ai {
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-weight: 800;
      letter-spacing: -0.5px;
      padding: 0 12px;
    }

    .tool-btn.icon-only {
      width: 34px;
      padding: 0;
    }

    .install-badge-btn {
      background: #059669;
      color: #fff;
      border: none;
      display: none;
      gap: 4px;
      font-size: 13px;
    }

    /* 2열: 성경 책, 장, 절 선택 */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    select {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    /* 3열: 역본 비교대조 작업표시줄 */
    .version-compare-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 10;
    }

    .version-chip {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .version-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* 화면 슬라이딩 뷰포트 */
    .slider-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .screen-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 10px 6px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #bibleScreen {
      transform: translateX(0);
    }

    #bibleScreen.slide-out {
      transform: translateX(-100%);
    }

    #aiScreen {
      transform: translateX(100%);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    #aiScreen.slide-in {
      transform: translateX(0);
    }

    /* 구절 렌더링 스타일 */
    .verse-item {
      padding: 6px 4px;
      border-radius: 6px;
      margin-bottom: 3px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
    }

    .verse-item:hover {
      background: rgba(37, 99, 235, 0.04);
    }

    .verse-item.selected {
      background: var(--highlight);
    }

    .verse-num {
      color: var(--primary);
      font-weight: 700;
      font-size: calc(var(--bible-font-size) - 2px);
      min-width: 16px;
      text-align: right;
      user-select: none;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .verse-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .verse-line {
      font-size: var(--bible-font-size) !important;
      line-height: 1.75 !important;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-all;
    }

    .verse-line.lang-en {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .compare-tag {
      font-size: 11px;
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
      font-weight: 600;
      vertical-align: middle;
      display: inline-block;
    }

    /* AI 응답 화면 */
    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .ai-result-body {
      flex: 1;
      overflow-y: auto;
      font-size: 15.5px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: 10px;
      width: 100%;
      max-width: 380px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    #loadingModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 16px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

      </button>
      <button class="tool-btn icon-only" id="settingsBtn" title="설정 및 역본 관리">
        <i data-lucide="settings" style="width:18px;height:18px;"></i>
      </button>
      <input type="file" id="lfaFileInput" accept="*/*" style="display:none;" />
      <button class="tool-btn icon-only" onclick="document.getElementById('lfaFileInput').click()" title="성경 파일 추가">+</button>
    </div>
    <div class="tool-group-right">

        <i data-lucide="download" style="width:16px;height:16px;"></i> 앱 설치
      </button>
    </div>
  </header>

    <select id="bookSelect"></select>
    <select id="chapterSelect"></select>
    <select id="verseSelect"></select>
  </nav>

  <!-- 3열: 각 설치된 역본 선택 및 비교대조 바 -->

  <!-- 본문 / AI 전환 슬라이더 -->
  <div class="slider-viewport">
    <main class="screen-panel" id="bibleScreen">
      <div id="versesContainer"></div>
    </main>

    <section class="screen-panel" id="aiScreen">
      <div class="ai-header">
        <h3 id="aiTitle" style="font-size:16px;font-weight:700;">구절 해설</h3>
        <button class="tool-btn" id="aiBackBtn" style="gap:4px;">
          <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> 성경으로 돌아가기
        </button>
      </div>
      <div class="ai-result-body" id="aiResultText">해설을 불러오는 중입니다...</div>
    </section>
  </div>

  <!-- 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-color);">
        <h3 style="font-size:16px;font-weight:700;">역본 관리 및 삭제</h3>
        <button onclick="document.getElementById('settingsModal').style.display='none'" style="background:none;border:none;cursor:pointer;font-size:20px;">&times;</button>
      </div>
      <div id="settingsTransList"></div>
    </div>
  </div>

      installBtn.style.display = 'inline-flex';

      if (deferredPrompt) {
        deferredPrompt.prompt();

    let db;
    let currentBook = 0;
    let currentChapter = 1;

    let selectedVerseRef = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("YbibleDB", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("translations")) d.createObjectStore("translations", { keyPath: "id" });
          if (!d.objectStoreNames.contains("verses")) {
            const store = d.createObjectStore("verses", { keyPath: "id" });
            store.createIndex("query_idx", ["translationId", "book", "chapter"], { unique: false });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = reject;
      });
    }

    function initSelectors() {
      const bSel = document.getElementById("bookSelect");
      bSel.innerHTML = "";
      BIBLE_BOOKS.forEach((b, i) => {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = b;
        bSel.appendChild(opt);
      });

      bSel.onchange = (e) => {
        currentBook = parseInt(e.target.value);
        currentChapter = 1;
        updateChapterSelect();
        renderVerses();
      };

      updateChapterSelect();
      document.getElementById("chapterSelect").onchange = (e) => {
        currentChapter = parseInt(e.target.value);
        updateVerseSelect();
        renderVerses();
      };

      document.getElementById("verseSelect").onchange = (e) => {
        const v = parseInt(e.target.value);
        if (v > 0) {
          const el = document.querySelector(`.verse-item[data-verse="${v}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('selected');
            setTimeout(() => el.classList.remove('selected'), 1200);
          }
        }
      };
    }

    function updateChapterSelect() {
      const cSel = document.getElementById("chapterSelect");
      cSel.innerHTML = "";
      const maxCh = BIBLE_STRUCTURE[currentBook] ? BIBLE_STRUCTURE[currentBook].length : 1;
      for (let i = 1; i <= maxCh; i++) {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = `${i}장`;
        cSel.appendChild(opt);
      }
      updateVerseSelect();
    }

    function updateVerseSelect() {
      const vSel = document.getElementById("verseSelect");
      vSel.innerHTML = "";
      const maxVerse = (BIBLE_STRUCTURE[currentBook] && BIBLE_STRUCTURE[currentBook][currentChapter - 1]) || 30;
      for (let i = 1; i <= maxVerse; i++) {
        const opt = document.createElement("option");
        opt.value = i; opt.textContent = `${i}절`;
        vSel.appendChild(opt);
      }
    }

    async function updateVersionBar() {
      const bar = document.getElementById("versionCompareBar");
      bar.innerHTML = "";
      translationNameMap = {};

      const tx = db.transaction("translations", "readonly");
      const list = await new Promise(res => {
        const req = tx.objectStore("translations").getAll();
        req.onsuccess = () => res(req.result);
      });

      list.forEach(item => {
        translationNameMap[item.id] = item.name;
      });

      if (list.length > 0 && activeTranslations.length === 0) {
        activeTranslations = [list[0].id];
      }

      list.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "version-chip" + (activeTranslations.includes(item.id) ? " active" : "");
        chip.textContent = item.name;
        chip.onclick = () => {
          if (activeTranslations.includes(item.id)) {
            if (activeTranslations.length > 1) {
              activeTranslations = activeTranslations.filter(id => id !== item.id);
            }
          } else {
            activeTranslations.push(item.id);
          }
          updateVersionBar();
          renderVerses();
        };
        bar.appendChild(chip);
      });
    }

    async function renderVerses() {
      const container = document.getElementById("versesContainer");
      container.innerHTML = "";
      selectedVerseRef = null;

      if (activeTranslations.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:30px;'>상단에서 최소 하나의 역본을 선택해주세요.</p>";
        return;
      }

      const tx = db.transaction("verses", "readonly");
      const store = tx.objectStore("verses");
      const index = store.index("query_idx");

      const map = new Map();
      for (const tId of activeTranslations) {
        const range = IDBKeyRange.only([tId, currentBook, currentChapter]);
        await new Promise(res => {
          index.getAll(range).onsuccess = (e) => {
            e.target.result.forEach(r => {
              if (!map.has(r.verse)) map.set(r.verse, {});
              map.get(r.verse)[tId] = r.text;
            });
            res();
          };
        });
      }

      const sorted = Array.from(map.keys()).sort((a,b)=>a-b);
      if (sorted.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:30px;'>성경 구절 데이터가 없습니다. 상단 [+] 버튼을 눌러 성경 파일(.lfa)을 추가해 주세요.</p>";
        return;
      }

      const isMulti = activeTranslations.length > 1;

      sorted.forEach(vNum => {
        const item = document.createElement("div");
        item.className = "verse-item";
        item.dataset.verse = vNum;

        let contentHtml = "";
        activeTranslations.forEach(tId => {
          const text = map.get(vNum)[tId] || "(해당 구절 없음)";
          const isEn = /[a-zA-Z]/.test(text) && !/[가-힣]/.test(text);
          const dName = translationNameMap[tId] || tId;
          contentHtml += `
            <div class="verse-line ${isEn?'lang-en':''}">
              ${isMulti ? `<span class="compare-tag">${dName}</span>` : ''}${text}
            </div>
          `;
        });

        item.innerHTML = `
          <div class="verse-num">${vNum}</div>
          <div class="verse-content-box">${contentHtml}</div>
        `;

        item.onclick = () => {
          document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          selectedVerseRef = `${BIBLE_BOOKS[currentBook]} ${currentChapter}:${vNum}`;
          selectedVerseText = item.querySelector('.verse-content-box').textContent.trim();
        };

        container.appendChild(item);
      });
    }

    // --- AI 화면 슬라이딩 전환 ---
    document.getElementById("aiBtn").onclick = () => {
      if (!selectedVerseRef) {
        alert("해설을 보실 성경 구절을 먼저 선택해 주세요.");
        return;
      }

      document.getElementById("aiTitle").textContent = `${selectedVerseRef} 해설`;
      document.getElementById("aiResultText").textContent = `'${selectedVerseRef}' 구절을 분석하고 해설을 생성 중입니다...`;

      document.getElementById("bibleScreen").classList.add("slide-out");
      document.getElementById("aiScreen").classList.add("slide-in");

      setTimeout(() => {
        document.getElementById("aiResultText").textContent = 
          `[${selectedVerseRef} 본문 신학 해설]\n\n` +
          `1. 핵심 의미:\n본 구절("${selectedVerseText.slice(0, 45)}...")은 하나님의 구속사적 맥락과 창조 질서의 주권적 섭리를 나타냅니다.\n\n` +
          `2. 원어 및 배경 묵상:\n원문의 뉘앙스는 언약적 신실하심(헤세드/피스티스)을 증언하며, 오늘날 성도의 구체적인 순종과 믿음의 결단을 요청합니다.`;
      }, 600);
    };

    document.getElementById("aiBackBtn").onclick = () => {
      document.getElementById("bibleScreen").classList.remove("slide-out");
      document.getElementById("aiScreen").classList.remove("slide-in");
    };

    // --- 다크/데이모드 전환 ---
    document.getElementById("themeBtn").onclick = () => {
      const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("ybible_theme", nextTheme);
      document.getElementById("themeIcon").setAttribute("data-lucide", nextTheme === "dark" ? "sun" : "moon");
      lucide.createIcons();
    };

    function initTheme() {
      const saved = localStorage.getItem("ybible_theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
      document.getElementById("themeIcon").setAttribute("data-lucide", saved === "dark" ? "sun" : "moon");
    }

    // --- 설정 모달 (역본 삭제) ---
    document.getElementById("settingsBtn").onclick = async () => {
      const listEl = document.getElementById("settingsTransList");
      listEl.innerHTML = "";
      const tx = db.transaction("translations", "readonly");
      tx.objectStore("translations").getAll().onsuccess = (e) => {
        const list = e.target.result;
        if (list.length === 0) {
          listEl.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:20px 0;'>등록된 역본이 없습니다.</p>";
        } else {
          list.forEach(item => {
            const row = document.createElement("div");
            row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);";
            row.innerHTML = `
              <span style="font-weight:600;">${item.name}</span>
              <button style="background:#ef4444;color:#fff;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">삭제</button>
            `;
            row.querySelector("button").onclick = () => deleteTranslation(item.id, item.name);
            listEl.appendChild(row);
          });
        }
        document.getElementById("settingsModal").style.display = "flex";
      };
    };

    async function deleteTranslation(id, name) {
      if (!confirm(`'${name}' 역본을 완전히 삭제하시겠습니까?\n(해당 역본의 66권 전체 본문 데이터가 제거됩니다)`)) return;
      
      const modal = document.getElementById("loadingModal");
      const statusText = document.getElementById("loadingStatus");
      modal.style.display = "flex";
      statusText.textContent = `'${name}' 역본 데이터 삭제 중...`;

      try {
        const tx = db.transaction(["translations", "verses"], "readwrite");
        tx.objectStore("translations").delete(id);

        const vStore = tx.objectStore("verses");
        const index = vStore.index("query_idx");

        for (let b = 0; b < 66; b++) {
          for (let c = 1; c <= 150; c++) {
            const range = IDBKeyRange.only([id, b, c]);
            const req = index.openCursor(range);
            req.onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor) {
                vStore.delete(cursor.primaryKey);
                cursor.continue();
              }
            };
          }
        }

        await new Promise((res, rej) => {
          tx.oncomplete = () => res();
          tx.onerror = rej;
        });

        activeTranslations = activeTranslations.filter(t => t !== id);
        modal.style.display = "none";
        document.getElementById("settingsModal").style.display = "none";
        alert(`'${name}' 역본이 삭제되었습니다.`);
        await updateVersionBar();
        renderVerses();
      } catch (err) {
        modal.style.display = "none";
        alert("삭제 중 오류 발생: " + err.message);
      }
    }

    // --- 다국어 / 한글 / 새번역 정밀 LFB 바이너리 디코더 ---
    function decodeLFBPureUniversal(uint8) {
      const decEUCKR = new TextDecoder("euc-kr", { fatal: false });
      const decUTF8 = new TextDecoder("utf-8", { fatal: false });
      const decUTF16LE = new TextDecoder("utf-16le", { fatal: false });

      const blocks = [];
      let start = 0;

      for (let i = 0; i < uint8.length; i++) {
        if (uint8[i] === 0 || uint8[i] === 10 || uint8[i] === 13) {
          if (i > start) {
            blocks.push(uint8.subarray(start, i));
          }
          start = i + 1;
        }
      }
      if (start < uint8.length) {
        blocks.push(uint8.subarray(start));
      }

      const verses = [];

      for (const block of blocks) {
        if (block.length < 2) continue;

        let strEUC = decEUCKR.decode(block);
        let strUTF = decUTF8.decode(block);
        let str16 = block.length % 2 === 0 ? decUTF16LE.decode(block) : "";

        let scoreEUC = (strEUC.match(/[가-힣a-zA-Z]/g) || []).length;
        let scoreUTF = (strUTF.match(/[가-힣a-zA-Z]/g) || []).length;
        let score16 = (str16.match(/[가-힣a-zA-Z]/g) || []).length;

        let bestStr = strUTF;
        let bestScore = scoreUTF;

        if (scoreEUC > bestScore) {
          bestStr = strEUC;
          bestScore = scoreEUC;
        }
        if (score16 > bestScore) {
          bestStr = str16;
          bestScore = score16;
        }

        if (bestScore >= 2) {
          let clean = bestStr.replace(/^[가-힣a-zA-Z0-9\s]{1,15}\s*\d+[:\.\s_]\d+[\s\t]*/, '').trim();
          clean = clean.replace(/^[\s\d:_\.\-\/\x00-\x1F\x7F\uFFFD\u25C6\u25A0\u4E00-\u9FFF]+/, '').trim();
          clean = clean.replace(/[\x00-\x1F\x7F\uFFFD]/g, '').trim();

          if (clean.length > 0 && /[가-힣a-zA-Z]/.test(clean)) {
            verses.push(clean);
          }
        }
      }

      return verses;
    }

    function findZipBuffer(buffer) {
      const uint8 = new Uint8Array(buffer);
      for (let i = 0; i < uint8.length - 4; i++) {
        if (uint8[i] === 0x50 && uint8[i+1] === 0x4B && uint8[i+2] === 0x03 && uint8[i+3] === 0x04) {
          return buffer.slice(i);
        }
      }
      return buffer;
    }

    async function parseZipAll66Books(zip, transId, statusText) {
      const verses = [];
      const filenames = Object.keys(zip.files).filter(name => !zip.files[name].dir);
      const regexLFB = /(\d{1,2})[_\-](\d{1,3})\.lfb$/i;

      let fileCount = 0;
      for (const filename of filenames) {
        const match = filename.match(regexLFB);
        if (!match) continue;

        const bIdx = parseInt(match[1], 10) - 1;
        const ch = parseInt(match[2], 10);

        if (bIdx >= 0 && bIdx < 66) {
          const uint8 = await zip.files[filename].async("uint8array");
          const verseList = decodeLFBPureUniversal(uint8);

          for (let v = 0; v < verseList.length; v++) {
            verses.push({
              id: `${transId}_${bIdx}_${ch}_${v + 1}`,
              translationId: transId,
              book: bIdx,
              chapter: ch,
              verse: v + 1,
              text: verseList[v]
            });
          }
          fileCount++;
          if (fileCount % 100 === 0 && statusText) {
            statusText.textContent = `66권 복원 진행 중... (${fileCount}/1,189장 완료)`;
          }
        }
      }
      return verses;
    }

    // --- LFA 파일 추가 및 고속 저장 ---
    document.getElementById("lfaFileInput").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const modal = document.getElementById("loadingModal");
      const statusText = document.getElementById("loadingStatus");
      modal.style.display = "flex";
      statusText.textContent = "성경 아카이브 파일 분석 중...";

      try {
        let defaultName = file.name.replace(/\.[^/.]+$/, "");
        const lower = defaultName.toLowerCase();
        if (lower.includes("kornrsv") || lower.includes("새번역")) defaultName = "새번역";
        else if (lower.includes("kornkrv") || lower.includes("개역개정")) defaultName = "개역개정";
        else if (lower.includes("krv") || lower.includes("개역한글")) defaultName = "개역한글";
        else if (lower.includes("tniv")) defaultName = "TNIV";
        else if (lower.includes("niv")) defaultName = "NIV";

        const arrayBuffer = await file.arrayBuffer();
        const transId = "VER_" + Date.now();

        const cleanBuffer = findZipBuffer(arrayBuffer);
        const zip = await JSZip.loadAsync(cleanBuffer);

        statusText.textContent = "66권 1,189개 장 바이너리 정밀 복원 중...";
        const verses = await parseZipAll66Books(zip, transId, statusText);

        if (verses.length === 0) {
          modal.style.display = "none";
          alert("성경 구절을 파싱하지 못했습니다. 올바른 LFA 성경 파일인지 확인해주세요.");
          return;
        }

        const versionName = prompt(`성공적으로 66권 전체(${verses.length}개 구절)를 추출했습니다!\n등록할 역본 이름을 입력하세요:`, defaultName) || defaultName;

        statusText.textContent = `데이터베이스에 66권 전체(${verses.length}개 구절) 고속 저장 중...`;
        
        const tx = db.transaction(["translations", "verses"], "readwrite");
        tx.objectStore("translations").put({ id: transId, name: versionName });
        const vStore = tx.objectStore("verses");
        for (let i = 0; i < verses.length; i++) {
          vStore.put(verses[i]);
        }

        await new Promise((res, rej) => {
          tx.oncomplete = () => res();
          tx.onerror = rej;
        });

        modal.style.display = "none";
        alert(`'${versionName}' (${verses.length}개 구절)이 성공적으로 등록되었습니다!`);

        if (!activeTranslations.includes(transId)) {
          activeTranslations.push(transId);
        }
        await updateVersionBar();
        renderVerses();
      } catch (err) {
        modal.style.display = "none";
        alert("파일 처리 중 오류가 발생했습니다: " + err.message);
      } finally {
        e.target.value = "";
      }
    };

    window.onload = async () => {
      initTheme();
      await initDB();
      initSelectors();
      await updateVersionBar();
      renderVerses();
      lucide.createIcons();
    };
  </script>
