<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ybible</title>

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ybible" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- JSZip & Lucide Icons & Markdown Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --highlight: #e0f2fe;
      --bible-font-size: 16.5px;
    }

    [data-theme="dark"] {
      --bg-main: #000000;
      --bg-card: #000000;
      --bg-subtle: #121212;
      --border-color: #262626;
      --text-main: #f8fafc;
      --text-muted: #a3a3a3;
      --primary: #38bdf8;
      --highlight: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: pan-x pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1열: 작업표시줄 */
    .top-toolbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
    }

    .tool-group-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      position: relative;
    }

    .tool-group-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .tool-btn {
      height: 34px;
      padding: 0 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      position: relative;
    }

    .tool-btn.btn-ai {
      background: var(--primary);
      color: #ffffff;
      border: none;
      font-weight: 800;
      letter-spacing: -0.5px;
      padding: 0 12px;
    }

    .tool-btn.icon-only {
      width: 34px;
      padding: 0;
    }

    .tool-btn.dragging {
      opacity: 0.4;
      transform: scale(0.92);
      border: 2px dashed var(--primary);
    }

    .install-badge-btn {
      background: #059669;
      color: #fff;
      border: none;
      display: none;
      gap: 4px;
      font-size: 13px;
    }

    /* 2열: 성경 책, 장, 절 선택 */
    .nav-bar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    select {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    /* 3열: 역본 비교대조 작업표시줄 */
    .version-compare-bar {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 10;
      position: relative;
    }

    .version-chip {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: pan-x;
      position: relative;
    }

    .version-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .version-chip.dragging {
      opacity: 0.5;
      transform: scale(0.92);
      border: 2px dashed var(--primary);
    }

    /* 화면 슬라이딩 뷰포트 */
    .slider-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .screen-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 10px 6px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #bibleScreen {
      transform: translateX(0);
      touch-action: pan-y;
      background: var(--bg-card);
    }

    #bibleScreen.slide-out {
      transform: translateX(-100%);
    }

    #aiScreen {
      transform: translateX(100%);
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
      touch-action: pan-y;
    }

    #aiScreen.slide-in {
      transform: translateX(0);
    }

    .verse-item {
      padding: 6px 6px;
      border-radius: 6px;
      margin-bottom: 3px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      cursor: pointer;
      border: none !important;
    }

    .verse-item:hover {
      background: rgba(37, 99, 235, 0.04);
    }

    .verse-item.selected {
      background: var(--highlight) !important;
      border: none !important;
    }

    .verse-num {
      color: var(--primary);
      font-weight: 700;
      font-size: calc(var(--bible-font-size) - 2px);
      min-width: 16px;
      text-align: right;
      user-select: none;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .verse-content-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .verse-line {
      font-size: var(--bible-font-size) !important;
      line-height: 1.75 !important;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-all;
    }

    .verse-line.lang-en {
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .compare-tag {
      font-size: calc(var(--bible-font-size) * 0.7);
      background: var(--bg-subtle);
      color: var(--text-muted);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 5px;
      font-weight: 600;
      vertical-align: middle;
      display: inline-block;
    }

    #fontSizeToast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    /* AI 응답 화면 */
    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 14px;
      background: var(--bg-card);
    }

    .ai-result-body {
      flex: 1;
      overflow-y: auto;
      font-size: 15.5px;
      line-height: 1.8;
      color: var(--text-main);
      background: var(--bg-card);
    }

    .ai-result-body p {
      margin-bottom: 12px;
    }

    .ai-result-body ul, .ai-result-body ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .ai-result-body strong {
      color: var(--text-main);
    }

    .spin-animation {
      animation: spinLoader 1.1s linear infinite;
      display: inline-block;
      color: var(--primary);
    }

    @keyframes spinLoader {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: 10px;
      width: 100%;
      max-width: 440px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
    }

    .api-key-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-subtle);
      color: var(--text-main);
      margin: 8px 0 14px 0;
    }

    #loadingModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      font-size: 16px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 1열: 작업표시줄 -->
  <header class="top-toolbar">
    <div class="tool-group-left" id="toolbarBtnGroup">
      <button class="tool-btn btn-ai" id="aiBtn" data-tool="ai" title="선택 구절 AI 해설">Ai</button>
      <button class="tool-btn icon-only" id="themeBtn" data-tool="theme" title="화면 모드 전환">
        <i id="themeIcon" data-lucide="moon" style="width:18px;height:18px;"></i>
      </button>
      <button class="tool-btn icon-only" id="settingsBtn" data-tool="settings" title="설정 및 역본 관리">
        <i data-lucide="settings" style="width:18px;height:18px;"></i>
      </button>
      <input type="file" id="lfaFileInput" accept="*/*" style="display:none;" />
      <button class="tool-btn icon-only" id="addFileBtn" data-tool="add" onclick="document.getElementById('lfaFileInput').click()" title="성경 파일 추가">+</button>
      <button class="tool-btn icon-only" id="shareBtn" data-tool="share" title="선택 구절 공유">
        <i data-lucide="share-2" style="width:18px;height:18px;"></i>
      </button>
    </div>
    <div class="tool-group-right">
      <button class="tool-btn install-badge-btn" id="pwaInstallBtn">
        <i data-lucide="download" style="width:16px;height:16px;"></i> 앱 설치
      </button>
    </div>
  </header>

  <!-- 2열: 성경 책, 장, 절 선택 -->
  <nav class="nav-bar">
    <select id="bookSelect"></select>
    <select id="chapterSelect"></select>
    <select id="verseSelect"></select>
    <button class="tool-btn icon-only" id="goToAiBtn" title="AI 해설창 보기" style="margin-left:auto;">
      <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
    </button>
  </nav>

  <!-- 3열: 역본 대조 바 -->
  <div class="version-compare-bar" id="versionCompareBar"></div>

  <!-- 본문 / AI 전환 슬라이더 -->
  <div class="slider-viewport">
    <main class="screen-panel" id="bibleScreen">
      <div id="versesContainer"></div>
    </main>

    <section class="screen-panel" id="aiScreen">
      <div class="ai-header">
        <h3 id="aiTitle" style="font-size:16px;font-weight:700;">AI 구절 해설</h3>
        <button class="tool-btn icon-only" id="aiBackBtn" title="성경으로 돌아가기">
          <i data-lucide="arrow-left" style="width:18px;height:18px;"></i>
        </button>
      </div>
      <div class="ai-result-body" id="aiResultText">해설을 준비하고 있습니다...</div>
    </section>
  </div>

  <div id="fontSizeToast">글자 크기: 16.5px</div>

  <!-- 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) this.style.display='none'">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border-color);">
        <h3 style="font-size:16px;font-weight:700;">환경설정 & 역본 관리</h3>
        <button onclick="document.getElementById('settingsModal').style.display='none'" style="background:none;border:none;cursor:pointer;font-size:20px;">&times;</button>
      </div>

      <div style="margin-bottom: 14px; background: var(--bg-subtle); padding: 12px; border-radius: 8px;">
        <label style="font-size: 13px; font-weight: 700; color: var(--text-main); display:block; margin-bottom:4px;">Gemini API Key 등록</label>
        <div style="font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px;">
          구글 AI Studio에서 무료로 발급받은 API 키를 등록하면 실시간으로 제미나이의 해설을 받아옵니다.
        </div>
        <input type="password" id="geminiApiKeyInput" class="api-key-input" placeholder="AI Studio 발급 API 키 입력 (AIzaSy...)" style="margin-bottom:8px;" />
        <button class="tool-btn" style="width:100%; background:var(--primary); color:#fff; border:none;" onclick="saveApiKey()">API 키 저장하기</button>
      </div>

      <div style="font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;">설치된 역본 관리 (이름 변경 및 삭제)</div>
      <div id="settingsTransList"></div>
    </div>
  </div>

  <div id="loadingModal">
    <div style="font-size: 19px; font-weight: bold; margin-bottom: 10px;">성경 데이터 처리 중...</div>
    <div id="loadingStatus">잠시만 기다려주세요.</div>
  </div>

  <script>
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    }, { capture: true });

    let currentFontSize = parseFloat(localStorage.getItem('ybible_font_size')) || 16.5;
    let initialDistance = 0;
    let startFontSize = currentFontSize;
    let toastTimer = null;

    function applyFontSize(size, showToast = false) {
      currentFontSize = Math.min(Math.max(size, 12), 36);
      document.documentElement.style.setProperty('--bible-font-size', currentFontSize.toFixed(1) + 'px');
      localStorage.setItem('ybible_font_size', currentFontSize.toFixed(1));

      if (showToast) {
        const toast = document.getElementById('fontSizeToast');
        toast.textContent = `본문 글자 크기: ${currentFontSize.toFixed(1)}px`;
        toast.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.style.opacity = '0';
        }, 800);
      }
    }

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    const bibleScreenEl = document.getElementById('bibleScreen');
    const aiScreenEl = document.getElementById('aiScreen');

    bibleScreenEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        startFontSize = currentFontSize;
      }
    }, { passive: true });

    bibleScreenEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialDistance > 0) {
        const currentDist = getDistance(e.touches);
        const scale = currentDist / initialDistance;
        const newSize = startFontSize * scale;
        applyFontSize(newSize, true);
      }
    }, { passive: true });

    bibleScreenEl.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = 0;
      }
    }, { passive: true });

    let touchStartX = 0;
    let touchStartY = 0;

    bibleScreenEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    bibleScreenEl.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const diffX = touchStartX - e.changedTouches[0].clientX;
        const diffY = touchStartY - e.changedTouches[0].clientY;
        if (diffX > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          openAiScreen();
        }
      }
    }, { passive: true });

    aiScreenEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    aiScreenEl.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = touchStartY - e.changedTouches[0].clientY;
        if (diffX > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          closeAiScreen();
        }
      }
    }, { passive: true });

    let deferredPrompt = null;
    const installBtn = document.getElementById('pwaInstallBtn');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
      lucide.createIcons();
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      }
    });

    const BIBLE_BOOKS = [
      "창세기","출애굽기","레위기","민수기","신명기","여호수아","사사기","룻기","사무엘상","사무엘하",
      "열왕기상","열왕기하","역대상","역대하","에스라","느헤미야","에스더","욥기","시편","잠언",
      "전도서","아가","이사야","예레미야","예레미야애가","에스겔","다니엘","호세아","요엘","아모스",
      "오바댜","요나","미가","나훔","하박국","스바냐","학개","스가랴","말라기",
      "마태복음","마가복음","누가복음","요한복음","사도행전","로마서","고린도전서","고린도후서","갈라디아서","에베소서",
      "빌립보서","골로새서","데살로니가전서","데살로니가후서","디모데전서","디모데후서","디도서","빌레몬서","히브리서",
      "야고보서","베드로전서","베드로후서","요한일서","요한이서","요한삼서","유다서","요한계시록"
    ];

    const BIBLE_SHORT_NAMES = [
      "창","출","레","민","신","수","삿","룻","삼상","삼하",
      "왕상","왕하","대상","대하","스","느","에","욥","시","잠",
      "전","아","사","렘","애","겔","단","호","욜","암",
      "옵","욘","미","나","합","습","학","슥","말",
      "마","막","눅","요","행","롬","고전","고후","갈","엡",
      "빌","골","살전","살후","딤전","딤후","딛","몬","히",
      "약","벧전","벧후","요일","요이","요삼","유","계"
    ];

    const BIBLE_STRUCTURE = [
      [31,25,24,26,32,22,24,22,29,32,32,20,18,24,21,16,27,33,38,18,34,24,20,67,34,35,46,22,35,43,55,32,20,31,29,43,36,30,23,23,57,38,34,34,28,34,31,22,33,26],

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("YbibleDB", 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("translations")) d.createObjectStore("translations", { keyPath: "id" });
          if (!d.objectStoreNames.contains("verses")) {
            const store = d.createObjectStore("verses", { keyPath: "id" });
            store.createIndex("query_idx", ["translationId", "book", "chapter"], { unique: false });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = reject;
      });
    }

      bSel.onchange = (e) => {

    async function updateVersionBar() {
      const bar = document.getElementById("versionCompareBar");
      bar.innerHTML = "";
      translationNameMap = {};

      const tx = db.transaction("translations", "readonly");
      const list = await new Promise(res => {
        const req = tx.objectStore("translations").getAll();
        req.onsuccess = () => res(req.result);
      });

      list.forEach(item => {
        translationNameMap[item.id] = item.name;
      });

      const savedOrder = loadSavedOrder();
      list.sort((a, b) => {
        const idxA = savedOrder.indexOf(a.id);
        const idxB = savedOrder.indexOf(b.id);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return 0;
      });

      translationOrder = list.map(item => item.id);
      saveOrder(translationOrder);

      if (list.length > 0 && activeTranslations.length === 0) {
        activeTranslations = [list[0].id];
      }

      list.forEach(item => {
        const chip = document.createElement("div");
        const isActive = activeTranslations.includes(item.id);
        chip.className = "version-chip" + (isActive ? " active" : "");
        chip.textContent = item.name;
        chip.dataset.id = item.id;

        // 역본 클릭 시 선택/해제 토글 로직
        chip.onclick = () => {
          if (activeTranslations.includes(item.id)) {
            activeTranslations = activeTranslations.filter(id => id !== item.id);
            chip.classList.remove("active");
          } else {
            activeTranslations.push(item.id);
            activeTranslations.sort((a, b) => translationOrder.indexOf(a) - translationOrder.indexOf(b));
            chip.classList.add("active");
          }
          renderVerses();
        };

        setupRobustDragAndDrop(chip, bar, () => {
          const newOrder = Array.from(bar.querySelectorAll('.version-chip')).map(el => el.dataset.id);
          translationOrder = newOrder;
          saveOrder(translationOrder);
          activeTranslations.sort((a, b) => translationOrder.indexOf(a) - translationOrder.indexOf(b));
          renderVerses();
        });
        bar.appendChild(chip);
      });
    }

    function setupRobustDragAndDrop(item, container, onReorderCallback) {
      let activeDrag = null;
      let longPressTimer = null;
      let isDragging = false;

      item.addEventListener('touchstart', (e) => {
        if (e.touches.length > 1) return;
        isDragging = false;
        longPressTimer = setTimeout(() => {
          isDragging = true;
          activeDrag = item;
          item.classList.add('dragging');
          if (navigator.vibrate) navigator.vibrate(50);
        }, 350);
      }, { passive: true });

      item.addEventListener('touchmove', (e) => {
        if (!isDragging || !activeDrag) {
          clearTimeout(longPressTimer);
          return;
        }
        const touch = e.touches[0];
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetItem = targetElement ? targetElement.closest('.' + item.classList[0]) : null;

        if (targetItem && targetItem !== activeDrag && targetItem.parentNode === container) {
          const rect = targetItem.getBoundingClientRect();
          if (touch.clientX > rect.left + rect.width / 2) {
            targetItem.after(activeDrag);
          } else {
            targetItem.before(activeDrag);
          }
        }
      }, { passive: true });

      const finishTouch = () => {
        clearTimeout(longPressTimer);
        if (activeDrag) {
          activeDrag.classList.remove('dragging');
          activeDrag = null;
          if (onReorderCallback) onReorderCallback();
          setTimeout(() => { isDragging = false; }, 80);
        }
      };

      item.addEventListener('touchend', finishTouch);
      item.addEventListener('touchcancel', finishTouch);
    }

    async function renderVerses() {
      const container = document.getElementById("versesContainer");
      container.innerHTML = "";

      if (activeTranslations.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:30px;'>상단에서 최소 하나의 역본을 선택해주세요.</p>";
        return;
      }

      const tx = db.transaction("verses", "readonly");
      const store = tx.objectStore("verses");
      const index = store.index("query_idx");

      const map = new Map();
      for (const tId of activeTranslations) {
        const range = IDBKeyRange.only([tId, currentBook, currentChapter]);
        await new Promise(res => {
          index.getAll(range).onsuccess = (e) => {
            e.target.result.forEach(r => {
              if (!map.has(r.verse)) map.set(r.verse, {});
              map.get(r.verse)[tId] = r.text;
            });
            res();
          };
        });
      }

      const sorted = Array.from(map.keys()).sort((a,b)=>a-b);
      if (sorted.length === 0) {
        container.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:30px;'>성경 구절 데이터가 없습니다. 상단 [+] 버튼을 눌러 성경 파일(.lfa)을 추가해 주세요.</p>";
        return;
      }

      const isMulti = activeTranslations.length > 1;

      selectedVerseRef = `${BIBLE_BOOKS[currentBook]} ${currentChapter}:${sorted[0]}`;
      selectedVerseText = map.get(sorted[0])[activeTranslations[0]] || "";

      sorted.forEach((vNum, idx) => {
        const item = document.createElement("div");
        item.className = "verse-item" + (idx === 0 ? " selected" : "");
        item.dataset.verse = vNum;

        let contentHtml = "";
        activeTranslations.forEach(tId => {
          const text = map.get(vNum)[tId] || "(해당 구절 없음)";
          const isEn = /[a-zA-Z]/.test(text) && !/[가-힣]/.test(text);
          const dName = translationNameMap[tId] || tId;
          contentHtml += `
            <div class="verse-line ${isEn?'lang-en':''}">
              ${isMulti ? `<span class="compare-tag">${dName}</span>` : ''}${text}
            </div>
          `;
        });

        item.innerHTML = `
          <div class="verse-num">${vNum}</div>
          <div class="verse-content-box">${contentHtml}</div>
        `;

        item.onclick = () => {
          document.querySelectorAll('.verse-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
          selectedVerseRef = `${BIBLE_BOOKS[currentBook]} ${currentChapter}:${vNum}`;
          selectedVerseText = (map.get(vNum) && map.get(vNum)[activeTranslations[0]]) || item.querySelector('.verse-content-box').innerText.trim();
        };

        container.appendChild(item);
      });
    }

            <button onclick="document.getElementById('settingsBtn').click()" style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); padding:8px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;">
              ⚙️ API 키 등록
            </button>
          </div>
        </div>
      `;
    };

    function saveApiKey() {
      const key = document.getElementById("geminiApiKeyInput").value.trim();
      localStorage.setItem("ybible_gemini_api_key", key);
      alert("Gemini API 키가 저장되었습니다.");
      document.getElementById("settingsModal").style.display = "none";
    }

    document.getElementById("themeBtn").onclick = () => {
      const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
      const nextTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nextTheme);
      localStorage.setItem("ybible_theme", nextTheme);
      document.getElementById("themeIcon").setAttribute("data-lucide", nextTheme === "dark" ? "sun" : "moon");
      lucide.createIcons();
    };

    function initTheme() {
      const saved = localStorage.getItem("ybible_theme") || "light";
      document.documentElement.setAttribute("data-theme", saved);
      document.getElementById("themeIcon").setAttribute("data-lucide", saved === "dark" ? "sun" : "moon");
      const savedKey = localStorage.getItem("ybible_gemini_api_key") || "";
      document.getElementById("geminiApiKeyInput").value = savedKey;
      applyFontSize(currentFontSize, false);
    }

    document.getElementById("settingsBtn").onclick = async () => {
      renderSettingsModal();
      document.getElementById("settingsModal").style.display = "flex";
    };

    async function renderSettingsModal() {
      const listEl = document.getElementById("settingsTransList");
      listEl.innerHTML = "";
      const tx = db.transaction("translations", "readonly");
      tx.objectStore("translations").getAll().onsuccess = (e) => {
        const list = e.target.result;
        if (list.length === 0) {
          listEl.innerHTML = "<p style='text-align:center;color:var(--text-muted);padding:10px 0;'>등록된 역본이 없습니다.</p>";
        } else {
          list.forEach(item => {
            const row = document.createElement("div");
            row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-color);";
            row.innerHTML = `
              <span style="font-weight:600;font-size:13.5px;">${item.name}</span>
              <div style="display:flex;gap:4px;">
                <button class="rename-btn" style="background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">이름 변경</button>
                <button class="del-btn" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;">삭제</button>
              </div>
            `;
            row.querySelector(".rename-btn").onclick = () => renameTranslation(item.id, item.name);
            row.querySelector(".del-btn").onclick = () => deleteTranslation(item.id, item.name);
            listEl.appendChild(row);
          });
        }
      };
    }

    async function renameTranslation(id, oldName) {
      const newName = prompt(`'${oldName}' 역본의 새 이름을 입력하세요:`, oldName);
      if (!newName || newName.trim() === "" || newName === oldName) return;

      const tx = db.transaction("translations", "readwrite");
      tx.objectStore("translations").put({ id: id, name: newName.trim() });
      tx.oncomplete = () => {
        renderSettingsModal();
        updateVersionBar();
        renderVerses();
      };
    }

    async function deleteTranslation(id, name) {
      if (!confirm(`'${name}' 역본을 완전히 삭제하시겠습니까?`)) return;
      
      const modal = document.getElementById("loadingModal");
      const statusText = document.getElementById("loadingStatus");
      modal.style.display = "flex";
      statusText.textContent = `'${name}' 역본 데이터 삭제 중...`;

      try {
        const tx = db.transaction(["translations", "verses"], "readwrite");
        tx.objectStore("translations").delete(id);

        const vStore = tx.objectStore("verses");
        const index = vStore.index("query_idx");

        for (let b = 0; b < 66; b++) {
          for (let c = 1; c <= 150; c++) {
            const range = IDBKeyRange.only([id, b, c]);
            const req = index.openCursor(range);
            req.onsuccess = (e) => {
              const cursor = e.target.result;
              if (cursor) {
                vStore.delete(cursor.primaryKey);
                cursor.continue();
              }
            };
          }
        }

        await new Promise((res, rej) => {
          tx.oncomplete = () => res();
          tx.onerror = rej;
        });

        activeTranslations = activeTranslations.filter(t => t !== id);
        modal.style.display = "none";
        renderSettingsModal();
        alert(`'${name}' 역본이 삭제되었습니다.`);
        await updateVersionBar();
        renderVerses();
      } catch (err) {
        modal.style.display = "none";
        alert("삭제 중 오류 발생: " + err.message);
      }
    }

    function decodeLFBPureUniversal(uint8) {
      const decEUCKR = new TextDecoder("euc-kr", { fatal: false });
      const decUTF8 = new TextDecoder("utf-8", { fatal: false });
      const decUTF16LE = new TextDecoder("utf-16le", { fatal: false });

      const blocks = [];
      let start = 0;

      for (let i = 0; i < uint8.length; i++) {
        if (uint8[i] === 0 || uint8[i] === 10 || uint8[i] === 13) {
          if (i > start) blocks.push(uint8.subarray(start, i));
          start = i + 1;
        }
      }
      if (start < uint8.length) blocks.push(uint8.subarray(start));

      const verses = [];

      for (const block of blocks) {
        if (block.length < 2) continue;

        let strEUC = decEUCKR.decode(block);
        let strUTF = decUTF8.decode(block);
        let str16 = block.length % 2 === 0 ? decUTF16LE.decode(block) : "";

        let scoreEUC = (strEUC.match(/[가-힣a-zA-Z]/g) || []).length;
        let scoreUTF = (strUTF.match(/[가-힣a-zA-Z]/g) || []).length;
        let score16 = (str16.match(/[가-힣a-zA-Z]/g) || []).length;

        let bestStr = strUTF;
        let bestScore = scoreUTF;

        if (scoreEUC > bestScore) {
          bestStr = strEUC;
          bestScore = scoreEUC;
        }
        if (score16 > bestScore) {
          bestStr = str16;
          bestScore = score16;
        }

        if (bestScore >= 2) {
          let clean = bestStr.replace(/^[가-힣a-zA-Z0-9\s]{1,15}\s*\d+[:\.\s_]\d+[\s\t]*/, '').trim();
          clean = clean.replace(/^[\s\d:_\.\-\/\x00-\x1F\x7F\uFFFD\u25C6\u25A0]+/, '').trim();
          clean = clean.replace(/[\x00-\x1F\x7F\uFFFD]/g, '').trim();

          if (clean.length > 0 && /[가-힣a-zA-Z]/.test(clean)) {
            verses.push(clean);
          }
        }
      }

      return verses;
    }

    function findZipBuffer(buffer) {
      const uint8 = new Uint8Array(buffer);
      for (let i = 0; i < uint8.length - 4; i++) {
        if (uint8[i] === 0x50 && uint8[i+1] === 0x4B && uint8[i+2] === 0x03 && uint8[i+3] === 0x04) {
          return buffer.slice(i);
        }
      }
      return buffer;
    }

    async function parseZipAll66Books(zip, transId, statusText) {
      const verses = [];
      const filenames = Object.keys(zip.files).filter(name => !zip.files[name].dir);
      const regexLFB = /(\d{1,2})[_\-](\d{1,3})\.lfb$/i;

      let fileCount = 0;
      for (const filename of filenames) {
        const match = filename.match(regexLFB);
        if (!match) continue;

        const bIdx = parseInt(match[1], 10) - 1;
        const ch = parseInt(match[2], 10);

        if (bIdx >= 0 && bIdx < 66) {
          const uint8 = await zip.files[filename].async("uint8array");
          const verseList = decodeLFBPureUniversal(uint8);

          for (let v = 0; v < verseList.length; v++) {
            verses.push({
              id: `${transId}_${bIdx}_${ch}_${v + 1}`,
              translationId: transId,
              book: bIdx,
              chapter: ch,
              verse: v + 1,
              text: verseList[v]
            });
          }
          fileCount++;
          if (fileCount % 100 === 0 && statusText) {
            statusText.textContent = `66권 복원 진행 중... (${fileCount}/1,189장 완료)`;
          }
        }
      }
      return verses;
    }

    document.getElementById("lfaFileInput").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const modal = document.getElementById("loadingModal");
      const statusText = document.getElementById("loadingStatus");
      modal.style.display = "flex";
      statusText.textContent = "성경 아카이브 파일 분석 중...";

      try {
        let defaultName = file.name.replace(/\.[^/.]+$/, "");
        const lower = defaultName.toLowerCase();
        if (lower.includes("kornrsv") || lower.includes("새번역")) defaultName = "새번역";
        else if (lower.includes("kornkrv") || lower.includes("개역개정")) defaultName = "개역개정";
        else if (lower.includes("krv") || lower.includes("개역한글")) defaultName = "개역한글";
        else if (lower.includes("tniv")) defaultName = "TNIV";
        else if (lower.includes("niv")) defaultName = "NIV";

        const arrayBuffer = await file.arrayBuffer();
        const transId = "VER_" + Date.now();

        const cleanBuffer = findZipBuffer(arrayBuffer);
        const zip = await JSZip.loadAsync(cleanBuffer);

        statusText.textContent = "66권 1,189개 장 바이너리 정밀 복원 중...";
        const verses = await parseZipAll66Books(zip, transId, statusText);

        if (verses.length === 0) {
          modal.style.display = "none";
          alert("성경 구절을 파싱하지 못했습니다. 올바른 LFA 성경 파일인지 확인해주세요.");
          return;
        }

        const versionName = prompt(`성공적으로 66권 전체(${verses.length}개 구절)를 추출했습니다!\n등록할 역본 이름을 입력하세요:`, defaultName) || defaultName;

        statusText.textContent = `데이터베이스에 66권 전체(${verses.length}개 구절) 고속 저장 중...`;
        
        const tx = db.transaction(["translations", "verses"], "readwrite");
        tx.objectStore("translations").put({ id: transId, name: versionName });
        const vStore = tx.objectStore("verses");
        for (let i = 0; i < verses.length; i++) {
          vStore.put(verses[i]);
        }

        await new Promise((res, rej) => {
          tx.oncomplete = () => res();
          tx.onerror = rej;
        });

        modal.style.display = "none";
        alert(`'${versionName}' (${verses.length}개 구절)이 성공적으로 등록되었습니다!`);

        if (!activeTranslations.includes(transId)) {
          activeTranslations.push(transId);
        }
        await updateVersionBar();
        renderVerses();
      } catch (err) {
        modal.style.display = "none";
        alert("파일 처리 중 오류가 발생했습니다: " + err.message);
      } finally {
        e.target.value = "";
      }
    };

    window.onload = async () => {
      initTheme();
      await initDB();
      initSelectors();
      initToolbarOrder();
      await updateVersionBar();
      renderVerses();
      lucide.createIcons();
    };
  </script>
