<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Yslide</title>

<!-- KoPubWorld 및 웹폰트 CDN 로드 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.0/kopubworld.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">

<!-- PWA 설정 및 강력 캐시 무효화 -->
<link rel="manifest" href="manifest.json?v=2026_perfect_mask_v46">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yslide">

<style>
  :root {
    --font-size: 30px;
    --line-height: 1.45;
    --top-margin: calc(var(--font-size) * var(--line-height) * 2); /* 상단 2줄 여백 */
    --slide-fixed-height: 740px;
    --color-yellow: #ffb703;
    --content-max-width: 1000px;
    --content-padding-x: 32px;
    --toolbar-height: 96px;
    --ui-font: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    background-color: #000000;
    color: #f3f4f6;
    font-family: 'KoPubWorld Dotum', 'Pretendard', sans-serif;
  }

  ::selection {
    background-color: rgba(255, 255, 255, 0.38);
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }
  ::-moz-selection {
    background-color: rgba(255, 255, 255, 0.38);
    text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
  }

  /* 상단 2단 고정 툴바 (UI 폰트 고정) */
  #toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--toolbar-height);
    background-color: #1e1e1e;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 16px;
    border-bottom: 1px solid #333;
    z-index: 9999999;
    gap: 6px;
    pointer-events: auto;
    font-family: var(--ui-font) !important;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 40px;
    font-family: var(--ui-font) !important;
  }

  /* 1단 (자간/줄간격/눈금선 2단/드래그 유지 글꼴 변경) */
  .toolbar-row-top {
    justify-content: flex-start;
    gap: 8px;
    border-bottom: 1px solid #292929;
    padding-bottom: 4px;
    height: 38px;
  }

  .btn-group { display: flex; gap: 8px; align-items: center; }
  
  button {
    padding: 0 12px; height: 34px; font-size: 13px; font-weight: bold;
    border: 1px solid #444; border-radius: 6px;
    background-color: #2c2c2c; color: #d1d5db; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; user-select: none;
    transition: all 0.15s ease;
    font-family: var(--ui-font) !important;
  }
  button:active { background-color: #404040; color: #fff; }
  
  .btn-icon { width: 34px; padding: 0; }
  
  .icon-svg {
    width: 17px; height: 17px; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .btn-format {
    width: 30px;
    height: 28px;
    padding: 0;
    font-size: 15px;
    font-weight: bold;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #e5e5e5;
    border-radius: 4px;
  }
  .btn-format:active {
    background-color: #3f3f3f;
    color: #38bdf8;
    border-color: #38bdf8;
  }
  
  .btn-height-toggle {
    height: 28px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: bold;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #38bdf8;
    border-radius: 4px;
  }
  .btn-height-toggle:active {
    background-color: #38bdf8;
    color: #000;
  }

  .btn-font-cycle {
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: bold;
    background-color: #282828;
    border: 1px solid #4a4a4a;
    color: #38bdf8;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
  }
  .btn-font-cycle:active {
    background-color: #38bdf8;
    color: #000;
  }

  .format-label {
    font-size: 13px;
    color: #9ca3af;
    margin-right: 2px;
    font-weight: bold;
    user-select: none;
    font-family: var(--ui-font) !important;
  }

  #btn-continuous.active {
    background-color: #ea580c; color: #ffffff; border-color: #f97316;
    box-shadow: 0 0 8px rgba(234, 88, 12, 0.6);
  }

  /* 색상 팔레트 */
  .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555; cursor: pointer; position: relative; padding: 0; }
  .color-btn.selected { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 6px rgba(255,255,255,0.8); }
  .c-white { background-color: #ffffff; }
  .c-red { background-color: #ef4444; }
  .c-yellow { background-color: var(--color-yellow); }
  .c-blue { background-color: #38bdf8; }
  .c-green { background-color: #4ade80; }

  .size-control {
    display: flex; align-items: center; gap: 4px; margin-left: 4px; background: #222;
    padding: 2px 4px; border-radius: 6px; border: 1px solid #383838;
  }
  .btn-step {
    width: 28px; height: 28px; font-size: 14px; font-weight: bold;
    background: #2c2c2c; border: 1px solid #444; border-radius: 4px; color: #e5e5e5;
  }
  .btn-step:active { background: #444; }
  #size-val {
    font-size: 13px; font-weight: bold; color: #d1d5db; width: 28px; text-align: center;
    font-family: var(--ui-font) !important;
  }

  #file-input { display: none; }

  .btn-play {
    background-color: #2c2c2c; color: #d1d5db; border: 1px solid #444;
    width: 40px; height: 34px; font-size: 15px; border-radius: 6px; padding: 0;
  }
  .btn-play:active { background-color: #404040; color: #fff; }

  /* 편집 스크롤 영역 */
  #editor-container {
    position: absolute;
    top: var(--toolbar-height);
    bottom: 0;
    left: 0;
    right: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background-color: #000000;
    display: flex;
    justify-content: center;
    padding: 0;
    z-index: 10;
  }
  #editor-container::-webkit-scrollbar { display: none; }

  #editor-wrapper {
    position: relative;
    width: 100%;
    max-width: var(--content-max-width);
    min-height: 100%;
    pointer-events: none;
  }

  /* 눈금선 레이어 (0px 기준) */
  #slide-indicators-layer {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none !important;
    user-select: none;
    z-index: 1;
  }

  .slide-boundary {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    border-bottom: 2px dashed rgba(255, 255, 255, 0.35);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    pointer-events: none !important;
  }

  .slide-boundary-badge {
    background-color: #1a1a1a;
    border: 1px solid #666;
    color: #d1d5db;
    font-size: 13px;
    font-weight: bold;
    padding: 2px 10px;
    border-radius: 10px;
    transform: translateY(-50%);
    margin-right: 20px;
    pointer-events: none !important;
    font-family: var(--ui-font) !important;
  }

  /* 에디터 본문 */
  #main-editor {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100%;
    background-color: transparent;
    padding: var(--top-margin) var(--content-padding-x) 24px var(--content-padding-x);
    outline: none;
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-weight: 500;
    word-break: keep-all;
    letter-spacing: normal;
    color: #ffffff;
    white-space: pre-wrap;
    box-sizing: border-box;
    pointer-events: auto;
  }

  #editor-bottom-spacer {
    height: calc(100vh - 140px);
    pointer-events: none;
  }

  body.paint-mode #main-editor {
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 삼성노트 스타일 0px 오버레이 퀵스크롤러 */
  #quick-scrollbar-track {
    position: fixed;
    top: calc(var(--toolbar-height) + 10px);
    right: 6px;
    bottom: 20px;
    width: 28px;
    z-index: 999998;
    display: flex;
    justify-content: center;
    user-select: none;
    touch-action: none;
    pointer-events: auto;
  }
  #quick-scrollbar-thumb {
    position: absolute;
    top: 0;
    width: 8px;
    height: 60px;
    background: rgba(160, 160, 160, 0.45);
    border: 1px solid rgba(220, 220, 220, 0.6);
    border-radius: 8px;
    cursor: grab;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
    transition: width 0.1s ease, background 0.1s ease;
  }
  #quick-scrollbar-thumb:active, #quick-scrollbar-track.dragging #quick-scrollbar-thumb {
    width: 16px;
    background: rgba(220, 220, 220, 0.85);
    border-color: #ffffff;
    cursor: grabbing;
  }
  #quick-scroll-badge {
    position: fixed;
    right: 44px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(26, 26, 26, 0.95);
    border: 1px solid #666;
    color: #e5e5e5;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    z-index: 999999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.7);
    font-family: var(--ui-font) !important;
  }
  #quick-scroll-badge.show { opacity: 1; }

  /* 전체모드 & 미리보기 */
  #reader-container {
    display: none;
    height: 100vh;
    width: 100vw;
    position: fixed;
    top: 0;
    left: 0;
    background-color: #000000;
    z-index: 10000000;
    user-select: none;
    overflow: hidden;
  }

  #reader-box {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 0;
    pointer-events: none;
  }

  /* 툴바 제거로 인한 과다 노출을 완벽하게 마스킹하는 뷰포트 */
  #reader-viewport {
    width: 100%;
    max-width: var(--content-max-width);
    height: var(--slide-fixed-height) !important;
    overflow: hidden !important;
    position: relative;
    box-sizing: border-box;
  }

  #reader-canvas {
    width: 100%;
    padding: var(--top-margin) var(--content-padding-x) 24px var(--content-padding-x);
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-weight: 500;
    word-break: keep-all;
    letter-spacing: normal;
    color: #ffffff;
    white-space: pre-wrap;
    box-sizing: border-box;
    position: absolute;
    top: 0;
    left: 0;
  }

  .touch-zone {
    position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3000;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #touch-left { left: 0; }
  #touch-right { right: 0; }

  #exit-btn {
    position: absolute; top: 18px; right: 24px;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(45, 45, 45, 0.75); border: 1px solid #777;
    color: #fff; font-size: 22px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    z-index: 5000; cursor: pointer; padding: 0;
    font-family: var(--ui-font) !important;
  }
  #exit-btn:active { background: rgba(239, 68, 68, 0.9); }

  #page-info {
    position: absolute; top: 18px; left: 24px; font-size: 15px;
    background: rgba(30, 30, 30, 0.75); padding: 5px 14px; border-radius: 12px;
    color: #ffb703; font-weight: bold; z-index: 5000; user-select: none; pointer-events: none;
    border: 1px solid #333;
    font-family: var(--ui-font) !important;
  }

  #toast-msg {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(34, 34, 34, 0.92);
    color: #38bdf8;
    border: 1px solid #444;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 99999999;
    font-family: var(--ui-font) !important;
  }
  #toast-msg.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: rgba(0, 0, 0, 0.85);
    z-index: 20000000;
    justify-content: center;
    align-items: center;
    font-family: var(--ui-font) !important;
  }
  .modal-box {
    width: 90%; max-width: 950px; height: 82vh;
    background-color: #1a1a1a;
    border: 1px solid #383838;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    font-family: var(--ui-font) !important;
  }
  .modal-header {
    padding: 16px 20px;
    background-color: #222;
    border-bottom: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 18px; color: #f3f4f6; font-weight: 600; }
  .modal-close {
    background: transparent; border: none; font-size: 20px; color: #888; cursor: pointer; width: 32px; height: 32px; padding: 0;
  }
  .modal-close:active { color: #fff; }
  
  #doc-grid {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 18px;
    align-content: start;
  }
  .doc-card {
    background-color: #242424;
    border: 1px solid #383838;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
    transition: all 0.15s ease;
  }
  .doc-card:active { transform: scale(0.98); border-color: #38bdf8; background-color: #2a2a2a; }
  .doc-title {
    font-size: 16px; font-weight: bold; color: #f3f4f6;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.4;
    margin-bottom: 8px;
  }
  .doc-preview {
    font-size: 13px; color: #9ca3af; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 12px;
  }
  .doc-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #6b7280; border-top: 1px solid #2e2e2e; padding-top: 8px;
  }
  .doc-del-btn {
    position: absolute; top: 10px; right: 10px;
    width: 22px; height: 22px; background: rgba(0,0,0,0.5);
    border: 1px solid #444; border-radius: 4px; color: #888;
    font-size: 12px; display: inline-flex; align-items: center; justify-content: center;
  }
  .doc-del-btn:active { background: #ef4444; color: #fff; }

  .modal-footer {
    padding: 12px 20px;
    background-color: #222;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 인쇄 스타일 */
  #print-container { display: none; }

  @media print {
    @page { margin: 18mm 15mm; size: auto; }
    html, body {
      position: static !important; overflow: visible !important;
      background-color: #ffffff !important; color: #000000 !important;
      height: auto !important; width: auto !important;
    }
    #toolbar, #editor-container, #reader-container, #storage-modal, #toast-msg, #quick-scrollbar-track, #quick-scroll-badge {
      display: none !important;
    }
    #print-container {
      display: block !important; width: 100% !important; background-color: #ffffff !important;
    }
    .print-slide-page {
      page-break-after: always !important; break-after: page !important;
      position: relative !important; padding: 10px 0 30px 0 !important;
      box-sizing: border-box !important;
    }
    .print-slide-page:last-child {
      page-break-after: avoid !important; break-after: avoid !important;
    }
    .print-slide-header {
      text-align: right; font-size: 11pt; font-weight: bold; color: #777777;
      margin-bottom: 15px; border-bottom: 1px solid #dddddd; padding-bottom: 4px;
      font-family: var(--ui-font) !important;
    }
    .print-slide-body {
      font-size: 18pt !important; line-height: 1.5 !important; font-weight: 500 !important;
      word-break: keep-all !important; color: #000000 !important; white-space: pre-wrap !important;
    }
  }
</style>
</head>
<body>

<div id="toolbar">
  <!-- 1단: 자간 / 줄간격 / 2단계 눈금선 (1, 2) / 드래그 유지 원터치 글꼴 토글 -->
  <div class="toolbar-row toolbar-row-top">
    <span class="format-label">자간:</span>
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(-0.5)" title="자간 좁게">-</button>
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLetterSpacing(0.5)" title="자간 넓게">+</button>

    <div style="width: 1px; height: 16px; background: #444; margin: 0 4px;"></div>

    <span class="format-label">줄간격:</span>
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLineHeight(-0.1)" title="줄간격 좁게">-</button>
    <button class="btn-format" onmousedown="event.preventDefault()" onclick="adjustLineHeight(0.1)" title="줄간격 넓게">+</button>

    <div style="width: 1px; height: 16px; background: #444; margin: 0 4px;"></div>

    <span class="format-label">눈금:</span>
    <button id="btn-slide-height" class="btn-height-toggle" onmousedown="event.preventDefault()" onclick="cycleSlideHeightStep()" title="눈금선 높이 2단계 토글 (1: 기본 72% / 2: 중간 86%)">📏 1</button>

    <div style="width: 1px; height: 16px; background: #444; margin: 0 4px;"></div>

    <span class="format-label">글꼴:</span>
    <button id="btn-font-cycle" class="btn-font-cycle" onmousedown="event.preventDefault()" onclick="cycleSelectedFontFamily()" title="선택 텍스트 글꼴 원터치 순환 변경 (KoPub돋움 ↔ KoPub바탕 ↔ Pretendard ↔ 시스템)">🔤 KoPub돋움</button>
  </div>

  <!-- 2단: 기본 기능 및 공유하기 -->
  <div class="toolbar-row">
    <div class="btn-group" id="edit-tools">
      <button class="btn-icon" onclick="openStorageModal()" title="문서 보관함 열기">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
        </svg>
      </button>
      <input type="file" id="file-input" accept=".txt,.json" onchange="handleFiles(this.files)">

      <button class="btn-icon" onclick="saveToFile()" title="파일 저장 및 보관">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
      </button>

      <button class="btn-icon" onclick="shareSelectedText()" title="선택 텍스트 공유하기 (카톡/메일/페이스북/블루투스)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
      </button>

          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>

      <button class="btn-icon" onclick="translateWithGemini()" title="Gemini AI 양방향 번역 (한↔영)">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>

      <button id="btn-continuous" onclick="toggleContinuousMode()">연속</button>

      <button class="color-btn c-white" onmousedown="event.preventDefault()" onclick="onColorBtnClick('#ffffff', this)" title="흰색"></button>

      <button class="color-btn c-yellow" onmousedown="event.preventDefault()" onclick="onColorBtnClick('#ffb703', this)" title="밝은 황금 주황"></button>

      <div class="size-control">

        <span id="size-val">30</span>

    <div class="btn-group">
      <button class="btn-icon" onclick="startPreviewCurrentSlide()" title="현재 슬라이드 미리보기">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button class="btn-play" onclick="startSermonMode(0)" title="처음부터 전체모드 시작">▶</button>

  </div>
</div>

<div id="editor-container">
  <div id="editor-wrapper">
    <div id="slide-indicators-layer"></div>
    <div id="main-editor" contenteditable="true" spellcheck="false"></div>
    <div id="editor-bottom-spacer"></div>
  </div>
</div>

<div id="quick-scrollbar-track">
  <div id="quick-scrollbar-thumb"></div>
</div>
<div id="quick-scroll-badge">1 슬라이드</div>

<!-- 전체모드 & 미리보기 -->
<div id="reader-container">
  <button id="exit-btn" onclick="exitSermonMode()" title="종료">✕</button>
  <div class="touch-zone" id="touch-left" onclick="prevPage()"></div>
  <div class="touch-zone" id="touch-right" onclick="nextPage()"></div>
  <div id="reader-box">
    <!-- 에디터 눈금선 높이와 1:1로 일치하는 뷰포트 -->
    <div id="reader-viewport">
      <div id="reader-canvas"></div>
    </div>
  </div>
  <div id="page-info"><span id="curr-page">1</span> / <span id="total-page">1</span></div>
</div>

<div id="print-container"></div>

<div id="storage-modal" class="modal-backdrop">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📁 Yslide 문서 보관함</h3>
      <button class="modal-close" onclick="closeStorageModal()">✕</button>
    </div>
    <div id="doc-grid"></div>
    <div class="modal-footer">
      <button onclick="document.getElementById('file-input').click(); closeStorageModal();" style="font-size: 13px;">외부 파일 불러오기 (.txt/.json)</button>
      <span style="font-size: 12px; color: #777;">원하는 문서를 선택하면 즉시 열립니다</span>
    </div>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js?v=' + Date.now()).then(reg => {
        reg.update();
      }).catch(() => {});
    });
  }

  const FONT_OPTIONS = [
    { name: "KoPub돋움", family: "'KoPubWorld Dotum', sans-serif" },
    { name: "KoPub바탕", family: "'KoPubWorld Batang', serif" },
    { name: "Pretendard", family: "'Pretendard', sans-serif" },
    { name: "시스템기본", family: "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" }
  ];
  let currentFontIndex = 0;

  const RATIO_STEPS = [0.72, 0.86];
  const TOOLBAR_HEIGHT = 96;
  let heightStepIndex = 0;
  let currentSlideHeight = 740;

  let isReaderMode = false;
  let isContinuousMode = false;
  let isMouseDown = false;
  let lastPaintedKey = "";
  let activeColor = '#ef4444';
  let currentFontSize = 30;
  let totalSlideCount = 1;
  let currentPageIndex = 0;
  let savedSelectionRange = null;

  const editor = document.getElementById('main-editor');
  const editorContainer = document.getElementById('editor-container');
  const indicatorsLayer = document.getElementById('slide-indicators-layer');
  const scrollTrack = document.getElementById('quick-scrollbar-track');
  const scrollThumb = document.getElementById('quick-scrollbar-thumb');
  const scrollBadge = document.getElementById('quick-scroll-badge');
  const readerCanvas = document.getElementById('reader-canvas');
  const readerViewport = document.getElementById('reader-viewport');
  const btnSlideHeight = document.getElementById('btn-slide-height');
  const btnFontCycle = document.getElementById('btn-font-cycle');

  let historyStack = [];
  const MAX_HISTORY = 40;

  function pushHistory() {
    try {
      const current = editor.innerHTML;
      if (historyStack.length === 0 || historyStack[historyStack.length - 1] !== current) {
        historyStack.push(current);
        if (historyStack.length > MAX_HISTORY) historyStack.shift();
      }
    } catch(e){}
  }

  function undoState() {
    try {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        editor.innerHTML = prev;
        saveEditorContent();
        updateSlideIndicators();
        updateScrollThumbPosition();
        showQuickToast("↶ 되돌리기가 적용되었습니다");
      } else if (document.execCommand) {
        document.execCommand('undo', false, null);
        saveEditorContent();
        updateSlideIndicators();
      }
    } catch(e){}
  }

  function saveCurrentSelection() {
    try {
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        const range = sel.getRangeAt(0);
        if (editor.contains(range.commonAncestorContainer)) {
          savedSelectionRange = range.cloneRange();
        }
      }
    } catch(e){}
  }

  document.addEventListener('selectionchange', () => {
    if (document.activeElement === editor) {
      saveCurrentSelection();
    }
  });

  /* 텍스트 노드 분할 스타일 주입 엔진 */
  function applyFontToRange(range, fontFamily) {
    if (!range || range.collapsed) return;

    if (range.startContainer === range.endContainer && range.startContainer.nodeType === Node.TEXT_NODE) {
      const textNode = range.startContainer;
      const span = document.createElement('span');
      span.style.fontFamily = fontFamily;

      const subRange = range.cloneRange();
      const extracted = subRange.extractContents();
      span.appendChild(extracted);
      subRange.insertNode(span);

      const newRange = document.createRange();
      newRange.selectNodeContents(span);
      return newRange;
    }

    const treeWalker = document.createTreeWalker(
      range.commonAncestorContainer,
      NodeFilter.SHOW_TEXT,
      {
        acceptNode: function(node) {
          if (range.intersectsNode(node)) {
            return NodeFilter.FILTER_ACCEPT;
          }
          return NodeFilter.FILTER_REJECT;
        }
      }
    );

    const nodesToWrap = [];
    while (treeWalker.nextNode()) {
      nodesToWrap.push(treeWalker.currentNode);
    }

    if (nodesToWrap.length === 0) return range;

    let firstCreatedSpan = null;
    let lastCreatedSpan = null;

    nodesToWrap.forEach((node) => {
      let start = (node === range.startContainer) ? range.startOffset : 0;
      let end = (node === range.endContainer) ? range.endOffset : node.textContent.length;

      if (start >= end) return;

      const subRange = document.createRange();
      subRange.setStart(node, start);
      subRange.setEnd(node, end);

      const span = document.createElement('span');
      span.style.fontFamily = fontFamily;

      const extracted = subRange.extractContents();
      span.appendChild(extracted);
      subRange.insertNode(span);

      if (!firstCreatedSpan) firstCreatedSpan = span;
      lastCreatedSpan = span;
    });

    const newRange = document.createRange();
    if (firstCreatedSpan && lastCreatedSpan) {
      newRange.setStartBefore(firstCreatedSpan);
      newRange.setEndAfter(lastCreatedSpan);
    }
    return newRange;
  }

  function cycleSelectedFontFamily() {
    const sel = window.getSelection();
    let range = (sel && sel.rangeCount > 0 && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) 
                ? sel.getRangeAt(0) 
                : savedSelectionRange;

    if (!range || range.collapsed) {
      showQuickToast("⚠️ 텍스트를 먼저 드래그하세요");
      return;
    }

    currentFontIndex = (currentFontIndex + 1) % FONT_OPTIONS.length;
    const targetFont = FONT_OPTIONS[currentFontIndex];
    if (btnFontCycle) btnFontCycle.innerText = `🔤 ${targetFont.name}`;

    const currentScroll = editorContainer.scrollTop;
    editor.focus();
    pushHistory();

    const newRange = applyFontToRange(range, targetFont.family);

    if (newRange) {
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange.cloneRange();
    }

    editorContainer.scrollTop = currentScroll;
    pushHistory();
    saveEditorContent();
    updateSlideIndicators();
    showQuickToast(`🔤 글꼴: ${targetFont.name}`);
  }

  /* 텍스트 공유하기 */
  async function shareSelectedText() {
    let shareText = '';
    const sel = window.getSelection();
    
    if (sel && !sel.isCollapsed && sel.toString().trim() !== '') {
      shareText = sel.toString().trim();
    } else if (savedSelectionRange && !savedSelectionRange.collapsed) {
      shareText = savedSelectionRange.toString().trim();
    } else {
      shareText = editor.innerText.trim();
    }

    if (!shareText) {
      showQuickToast("⚠️ 공유할 텍스트가 없습니다");
      return;
    }

    const firstLine = shareText.split('\n')[0].substring(0, 30);
    const shareData = {
      title: firstLine || 'Yslide 원고 공유',
      text: shareText
    };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
        showQuickToast("📤 공유가 완료되었습니다");
      } catch (err) {
        if (err.name !== 'AbortError') {
          copyTextFallback(shareText);
        }
      }
    } else {
      copyTextFallback(shareText);
    }
  }

  function copyTextFallback(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => {
        showQuickToast("📋 텍스트가 클립보드에 복사되었습니다");
      }).catch(() => {
        showQuickToast("⚠️ 복사에 실패했습니다");
      });
    } else {
      showQuickToast("📋 공유 기능을 지원하지 않는 브라우저입니다");
    }
  }

  /* 2단계 눈금선 토글 및 전체화면 뷰포트 완벽 동기화 */
  function cycleSlideHeightStep() {
    heightStepIndex = (heightStepIndex + 1) % 2;
    applySlideHeightByStep(heightStepIndex, true);
  }

  function applySlideHeightByStep(step, showToast = false) {
    const vh = window.innerHeight || document.documentElement.clientHeight || 1000;
    const availableEditorHeight = Math.max(480, vh - TOOLBAR_HEIGHT);
    const ratio = RATIO_STEPS[step] || 0.72;
    currentSlideHeight = Math.round(availableEditorHeight * ratio);

    if (step === 0) {
      if (btnSlideHeight) btnSlideHeight.innerText = "📏 1";
      if (showToast) showQuickToast(`📏 눈금선: 1단계 기본 (${currentSlideHeight}px)`);
    } else {
      if (btnSlideHeight) btnSlideHeight.innerText = "📏 2";
      if (showToast) showQuickToast(`📏 눈금선: 2단계 중간 (${currentSlideHeight}px)`);
    }

    document.documentElement.style.setProperty('--slide-fixed-height', currentSlideHeight + 'px');
    if (readerViewport) {
      readerViewport.style.height = currentSlideHeight + 'px';
    }

    try { localStorage.setItem('yslide_height_step', step); } catch(e){}
    updateSlideIndicators();
    updateScrollThumbPosition();
  }

  window.addEventListener('resize', () => {
    applySlideHeightByStep(heightStepIndex, false);
  });

  /* 1단 자간 연타 조절 */
  function adjustLetterSpacing(delta) {
    try {
      const sel = window.getSelection();
      let range = (sel && sel.rangeCount > 0 && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) 
                  ? sel.getRangeAt(0) 
                  : savedSelectionRange;
      if (!range || range.collapsed) {
        showQuickToast("⚠️ 텍스트를 먼저 드래그하세요");
        return;
      }

      const currentScroll = editorContainer.scrollTop;
      pushHistory();

      let targetEl = null;
      let node = range.commonAncestorContainer;
      if (node && node.nodeType === Node.TEXT_NODE) node = node.parentNode;

      if (node && node !== editor && node.tagName === 'SPAN') {
        targetEl = node;
        let cur = parseFloat(targetEl.style.letterSpacing) || 0;
        targetEl.style.letterSpacing = `${(cur + delta).toFixed(1)}px`;
      } else {
        targetEl = document.createElement('span');
        targetEl.style.letterSpacing = `${delta.toFixed(1)}px`;
        const fragment = range.extractContents();
        targetEl.appendChild(fragment);
        range.insertNode(targetEl);
      }

      const newRange = document.createRange();
      newRange.selectNodeContents(targetEl);
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange.cloneRange();

      editorContainer.scrollTop = currentScroll;
      saveEditorContent();
      updateSlideIndicators();
    } catch(err) {
      console.error(err);
    }
  }

  /* 1단 줄간격 연타 조절 */
  function adjustLineHeight(delta) {
    try {
      const sel = window.getSelection();
      let range = (sel && sel.rangeCount > 0 && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) 
                  ? sel.getRangeAt(0) 
                  : savedSelectionRange;
      if (!range || range.collapsed) {
        showQuickToast("⚠️ 텍스트를 먼저 드래그하세요");
        return;
      }

      const currentScroll = editorContainer.scrollTop;
      pushHistory();

      let targetEl = null;
      let node = range.commonAncestorContainer;
      if (node && node.nodeType === Node.TEXT_NODE) node = node.parentNode;

      if (node && node !== editor && node.tagName === 'SPAN') {
        targetEl = node;
        targetEl.style.display = 'inline-block';
        let cur = parseFloat(targetEl.style.lineHeight) || 1.45;
        targetEl.style.lineHeight = `${Math.max(0.8, cur + delta).toFixed(2)}`;
      } else {
        targetEl = document.createElement('span');
        targetEl.style.display = 'inline-block';
        let cur = 1.45;
        targetEl.style.lineHeight = `${Math.max(0.8, cur + delta).toFixed(2)}`;
        const fragment = range.extractContents();
        targetEl.appendChild(fragment);
        range.insertNode(targetEl);
      }

      const newRange = document.createRange();
      newRange.selectNodeContents(targetEl);
      sel.removeAllRanges();
      sel.addRange(newRange);
      savedSelectionRange = newRange.cloneRange();

      editorContainer.scrollTop = currentScroll;
      saveEditorContent();
      updateSlideIndicators();
    } catch(err) {
      console.error(err);
    }
  }

  window.addEventListener('mouseup', () => {
    if (isContinuousMode && isMouseDown) {
      isMouseDown = false;
      lastPaintedKey = "";
      pushHistory();
      saveEditorContent();
    }
  });

  window.addEventListener('touchend', () => {
    if (isContinuousMode) {
      isMouseDown = false;
      lastPaintedKey = "";
      pushHistory();
      saveEditorContent();
    }
  });

  function stepFontSize(delta) {
    currentFontSize = Math.min(48, Math.max(16, currentFontSize + delta));
    applyFontSize(currentFontSize);
  }

  function applyFontSize(size) {
    document.documentElement.style.setProperty('--font-size', size + 'px');
    const sv = document.getElementById('size-val');
    if (sv) sv.innerText = size;
    try { localStorage.setItem('yslide_font_size', size); } catch(e){}
    updateSlideIndicators();
    updateScrollThumbPosition();
  }

  function getAccurateSlideMetrics() {
    const slideHeight = currentSlideHeight;
    const textHeight = Math.max(editor.scrollHeight, slideHeight);
    const count = Math.max(1, Math.ceil(textHeight / slideHeight));
    return { slideHeight, count };
  }

  function updateSlideIndicators() {
    try {
      const { slideHeight, count } = getAccurateSlideMetrics();
      totalSlideCount = count;
      const drawCount = Math.max(totalSlideCount, 6);

      indicatorsLayer.innerHTML = '';
      for (let i = 1; i <= drawCount; i++) {
        const boundary = document.createElement('div');
        boundary.className = 'slide-boundary';
        boundary.style.top = `${slideHeight * i}px`;

        const badge = document.createElement('div');
        badge.className = 'slide-boundary-badge';
        badge.innerText = `[ ${i} ]`;

        boundary.appendChild(badge);
        indicatorsLayer.appendChild(boundary);
      }
    } catch(e){}
  }

  function updateScrollThumbPosition() {
    try {
      const scrollHeight = editorContainer.scrollHeight - editorContainer.clientHeight;
      if (scrollHeight <= 0) {
        scrollThumb.style.display = 'none';
        return;
      }
      scrollThumb.style.display = 'block';
      const trackHeight = scrollTrack.clientHeight - scrollThumb.offsetHeight;
      const progress = editorContainer.scrollTop / scrollHeight;
      scrollThumb.style.top = `${progress * trackHeight}px`;
    } catch(e){}
  }

  editorContainer.addEventListener('scroll', () => {
    if (!isDraggingScroll) {
      updateScrollThumbPosition();
    }
  });

  let isDraggingScroll = false;
  let startDragY = 0;
  let startScrollTop = 0;

  function onScrollDragStart(clientY) {
    isDraggingScroll = true;
    startDragY = clientY;
    startScrollTop = editorContainer.scrollTop;
    scrollTrack.classList.add('dragging');
    scrollBadge.classList.add('show');
    onScrollDragMove(clientY);
  }

  function onScrollDragMove(clientY) {
    if (!isDraggingScroll) return;
    const trackRect = scrollTrack.getBoundingClientRect();
    const trackHeight = trackRect.height - scrollThumb.offsetHeight;
    let offsetY = clientY - trackRect.top - (scrollThumb.offsetHeight / 2);
    offsetY = Math.max(0, Math.min(trackHeight, offsetY));

    const progress = offsetY / trackHeight;
    const maxScroll = editorContainer.scrollHeight - editorContainer.clientHeight;
    editorContainer.scrollTop = progress * maxScroll;
    scrollThumb.style.top = `${offsetY}px`;

    const currentSlide = Math.floor(editorContainer.scrollTop / currentSlideHeight) + 1;
    scrollBadge.innerText = `${currentSlide} 슬라이드`;
  }

  function onScrollDragEnd() {
    if (isDraggingScroll) {
      isDraggingScroll = false;
      scrollTrack.classList.remove('dragging');
      scrollBadge.classList.remove('show');
    }
  }

  scrollTrack.addEventListener('touchstart', (e) => {
    onScrollDragStart(e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchmove', (e) => {
    if (isDraggingScroll) {
      onScrollDragMove(e.touches[0].clientY);
      e.preventDefault();
    }
  }, { passive: false });

  window.addEventListener('touchend', onScrollDragEnd);

  scrollTrack.addEventListener('mousedown', (e) => {
    onScrollDragStart(e.clientY);
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (isDraggingScroll) {
      onScrollDragMove(e.clientY);
      e.preventDefault();
    }
  });

  window.addEventListener('mouseup', onScrollDragEnd);

  function paintWordAtPoint(x, y) {
    let range;
    if (document.caretRangeFromPoint) {
      range = document.caretRangeFromPoint(x, y);
    } else if (document.caretPositionFromPoint) {
      const pos = document.caretPositionFromPoint(x, y);
      if (pos) {
        range = document.createRange();
        range.setStart(pos.offsetNode, pos.offset);
        range.collapse(true);
      }
    }

    if (!range) return;

    let node = range.startContainer;
    if (node.nodeType !== Node.TEXT_NODE) {
      if (node.childNodes.length > 0 && range.startOffset < node.childNodes.length) {
        node = node.childNodes[range.startOffset];
        while (node && node.nodeType !== Node.TEXT_NODE && node.firstChild) {
          node = node.firstChild;
        }
      }
    }

    if (node && node.nodeType === Node.TEXT_NODE) {
      const text = node.textContent;
      const offset = range.startOffset;

      let start = Math.min(offset, text.length > 0 ? text.length - 1 : 0);
      while (start > 0 && !/\s/.test(text[start - 1])) start--;
      let end = offset;
      while (end < text.length && !/\s/.test(text[end])) end++;

      if (start < end) {
        const currentKey = `${node.textContent}_${start}_${end}`;
        if (lastPaintedKey === currentKey) return;
        lastPaintedKey = currentKey;

        const wordRange = document.createRange();
        wordRange.setStart(node, start);
        wordRange.setEnd(node, end);

        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(wordRange);

        document.execCommand('foreColor', false, activeColor);
        sel.removeAllRanges();
      }
    }
  }

  editor.addEventListener('touchstart', (e) => {
    if (isContinuousMode) {
      pushHistory();
      isMouseDown = true;
      const touch = e.touches[0];
      paintWordAtPoint(touch.clientX, touch.clientY);
      e.preventDefault();
    }
  }, { passive: false });

  editor.addEventListener('touchmove', (e) => {
    if (isContinuousMode && isMouseDown) {
      const touch = e.touches[0];

  function rgbToHex(rgb) {
    if (!rgb) return '';
    if (rgb.startsWith('#')) return rgb;
    const match = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (!match) return rgb;
    const r = parseInt(match[1]).toString(16).padStart(2, '0');
    const g = parseInt(match[2]).toString(16).padStart(2, '0');
    const b = parseInt(match[3]).toString(16).padStart(2, '0');
    return `#${r}${g}${b}`;
  }

  function isDefaultDarkColor(colorStr) {
    if (!colorStr) return true;
    const hex = rgbToHex(colorStr).toLowerCase();
    if (['#000000', '#111111', '#202124', '#222222', '#333333', '#1e1e1e', '#000', '#202020', 'transparent', 'inherit', 'initial'].includes(hex)) return true;
    const match = colorStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (match) {
      const r = parseInt(match[1]), g = parseInt(match[2]), b = parseInt(match[3]);
      if (r < 45 && g < 45 && b < 45) return true;
    }
    return false;
  }

  function insertHtmlAtCaret(html) {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      let range = sel.getRangeAt(0);
      if (!editor.contains(range.commonAncestorContainer)) {
        editor.focus();
        range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }
      range.deleteContents();
      
      const el = document.createElement("div");
      el.innerHTML = html;
      const frag = document.createDocumentFragment();
      let node, lastNode;
      while ((node = el.firstChild)) {
        lastNode = frag.appendChild(node);
      }
      range.insertNode(frag);
      if (lastNode) {
        range = range.cloneRange();
        range.setStartAfter(lastNode);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    } else {
      editor.innerHTML += html;
    }
  }

  function handleSmartPaste(e) {
    e.preventDefault();
    pushHistory();

    const clipboardData = e.clipboardData || window.clipboardData;
    const htmlData = clipboardData ? clipboardData.getData('text/html') : '';
    const textData = clipboardData ? clipboardData.getData('text/plain') : '';

    if (htmlData) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlData, 'text/html');

      doc.querySelectorAll('script, style, meta, link, svg, title').forEach(el => el.remove());

      function processNode(node, inheritedColor = '', inheritedFont = '') {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          if (!text) return '';
          let output = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          if (inheritedColor && !isDefaultDarkColor(inheritedColor)) {
            const hex = rgbToHex(inheritedColor);
            output = `<font color="${hex}">${output}</font>`;
          }
          if (inheritedFont) {
            output = `<span style="font-family:${inheritedFont}">${output}</span>`;
          }
          return output;
        }

        if (node.nodeType === Node.ELEMENT_NODE) {
          const tag = node.tagName.toLowerCase();
          if (tag === 'br') return '<br>';

          let curColor = node.style.color || node.getAttribute('color') || inheritedColor;
          let curFont = node.style.fontFamily || inheritedFont;

          let inner = '';
          node.childNodes.forEach(child => {
            inner += processNode(child, curColor, curFont);
          });

          if (tag === 'p' || tag === 'div' || tag === 'li' || tag === 'tr') {
            return inner + '<br>';
          }
          if (tag === 'b' || tag === 'strong' || node.style.fontWeight >= '600') {
            return `<b>${inner}</b>`;
          }
          if (tag === 'i' || tag === 'em' || node.style.fontStyle === 'italic') {
            return `<i>${inner}</i>`;
          }
          if (tag === 'u' || (node.style.textDecoration && node.style.textDecoration.includes('underline'))) {
            return `<u>${inner}</u>`;
          }
          return inner;
        }
        return '';
      }

      let finalHtml = '';
      doc.body.childNodes.forEach(child => {
        finalHtml += processNode(child, '', '');
      });

      finalHtml = finalHtml.replace(/(<br\s*[\/]?>){3,}/gi, '<br><br>');
      insertHtmlAtCaret(finalHtml);
    } else {
      const formattedText = textData.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>');
      insertHtmlAtCaret(formattedText);
    }

    setTimeout(() => {
      pushHistory();
      saveEditorContent();
      updateSlideIndicators();
      updateScrollThumbPosition();
    }, 20);
  }
