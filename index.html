<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 본문 & AI 해석</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      overflow-x: hidden;
      background-color: #f8f9fa;
      color: #212529;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    /* 상단 네비게이션 바 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
    }

    body.dark-mode header {
      background-color: #1e1e1e;
      border-bottom: 1px solid #333333;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 14px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background-color: #ffffff;
      color: inherit;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    body.dark-mode button {
      background-color: #2c2c2c;
      border-color: #444;
    }

    #ai-btn {
      background-color: #4a6cf7;
      color: #ffffff;
      border: none;
    }

    /* 슬라이드 뷰 컨테이너 */
    .view-slider {
      display: flex;
      width: 200vw;
      min-height: calc(100vh - 60px);
      transition: transform 0.4s ease-in-out;
    }

    .view-slider.show-ai {
      transform: translateX(-50vw);
    }

    /* 성경 본문 영역 (좌측 뷰) */
    .bible-view {
      width: 100vw;
      padding: 24px;
      line-height: 1.8;
    }

    .verse {
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 4px;
    }

    .verse:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    body.dark-mode .verse:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .verse.selected {
      background-color: #dbeafe;
      border-left: 4px solid #3b82f6;
    }

    body.dark-mode .verse.selected {
      background-color: #1e3a5f;
      border-left: 4px solid #60a5fa;
    }

    /* AI 대답 영역 (우측 뷰) */
    .ai-view {
      width: 100vw;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: inherit;
    }

    .ai-content-box {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 200px;
    }

    body.dark-mode .ai-content-box {
      background-color: #1e1e1e;
      border-color: #333;
    }

    .ai-footer {
      margin-top: 24px;
      padding-top: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h2>성경 읽기</h2>
    <div class="btn-group">
      <!-- 다크모드 버튼 왼쪽에 배치된 AI 버튼 -->
      <button id="ai-btn" onclick="requestAiInterpretation()">AI 해석</button>
      <button id="theme-btn" onclick="toggleDarkMode()">다크모드</button>
    </div>
  </header>

  <!-- 슬라이드 컨테이너 -->
  <div class="view-slider" id="viewSlider">
    
    <!-- 좌측: 성경 본문 뷰 -->
    <section class="bible-view">
      <div class="verse" data-ref="창1:1" onclick="selectVerse(this)">
        <strong>창 1:1</strong> 태초에 하나님이 천지를 창조하시니라
      </div>
      <div class="verse" data-ref="창1:2" onclick="selectVerse(this)">
        <strong>창 1:2</strong> 땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 영은 수면 위에 운행하시니라
      </div>
      <div class="verse" data-ref="창1:3" onclick="selectVerse(this)">
        <strong>창 1:3</strong> 하나님이 이르시되 빛이 있으라 하시니 빛이 있었고
      </div>
    </section>

    <!-- 우측: Gemini 응답 뷰 -->
    <section class="ai-view">
      <div>
        <h3 id="ai-query-title" style="margin-bottom: 16px;">AI 구절 해설</h3>
        <div class="ai-content-box" id="aiResponseText">해석을 불러오는 중입니다...</div>
      </div>
      <div class="ai-footer">
        <button class="back-btn" onclick="closeAiView()">&#8592; 성경 본문으로 돌아가기</button>
      </div>
    </section>

  </div>

  <script>
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY"; // 본인의 Gemini API 키 입력
    let selectedVerseRef = null;

    // 구절 선택 처리
    function selectVerse(element) {
      document.querySelectorAll('.verse').forEach(v => v.classList.remove('selected'));
      element.classList.add('selected');
      selectedVerseRef = element.getAttribute('data-ref');
    }

    // AI 버튼 클릭 시 처리
    async function requestAiInterpretation() {
      if (!selectedVerseRef) {
        alert('해석할 성경 구절을 먼저 선택해주세요.');
        return;
      }

      const promptText = `${selectedVerseRef} 무슨뜻?`;
      document.getElementById('ai-query-title').innerText = `[${selectedVerseRef}] AI 해설`;
      document.getElementById('aiResponseText').innerText = 'Gemini의 응답을 받아오는 중입니다...';

      // 화면 오른쪽 슬라이드 전환 실행
      document.getElementById('viewSlider').classList.add('show-ai');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: promptText }]
            }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          document.getElementById('aiResponseText').innerText = data.candidates[0].content.parts[0].text;
        } else {
          document.getElementById('aiResponseText').innerText = '응답을 파싱하지 못했습니다. 다시 시도해주세요.';
        }
      } catch (error) {
        document.getElementById('aiResponseText').innerText = 'AI 호출 중 오류가 발생했습니다: ' + error.message;
      }
    }

    // 성경 화면 복귀 처리
    function closeAiView() {
      document.getElementById('viewSlider').classList.remove('show-ai');
    }

    // 다크모드 토글
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }
  </script>

</body>
</html>
