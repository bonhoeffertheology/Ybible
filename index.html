<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성경 본문 뷰어</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --border-color: #e2e8f0;
      --bar-bg: #f8fafc;
      --hover-bg: #e2e8f0;
      --modal-overlay: rgba(0, 0, 0, 0.4);
      --btn-color: #475569;
      --btn-active: #0f172a;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --border-color: #2d3748;
      --bar-bg: #1a202c;
      --hover-bg: #2d3748;
      --modal-overlay: rgba(0, 0, 0, 0.7);
      --btn-color: #a0aec0;
      --btn-active: #f7fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* 1. 최상단 내비게이션 바 (책, 장, 절 선택) */
    .top-nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--bar-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .selector-btn {
      padding: 6px 12px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .selector-btn:hover {
      background-color: var(--hover-bg);
    }

    /* 2~6. 작업표시줄 (아이콘 툴바) */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 6px 16px;
      background-color: var(--bar-bg);
      border-bottom: 1px solid var(--border-color);
      gap: 6px;
    }

    .tool-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: var(--btn-color);
      cursor: pointer;
      padding: 6px;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background-color: var(--hover-bg);
      color: var(--btn-active);
    }

    .tool-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 본문 영역 */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      line-height: 1.8;
      font-size: 17px;
    }

    .verse-item {
      margin-bottom: 8px;
    }

    .verse-num {
      font-weight: bold;
      color: #718096;
      margin-right: 6px;
      font-size: 0.9em;
    }

    /* 팝업 모달 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--modal-overlay);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: 600;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
    }

    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: 8px;
    }

    .book-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 6px;
    }

    .grid-btn {
      padding: 8px 4px;
      text-align: center;
      background: var(--bar-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-color);
      font-size: 14px;
    }

    .grid-btn:hover {
      background: var(--hover-bg);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--btn-color);
    }

    /* 설정 / 역본 관리 리스트 스타일 */
    .version-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .delete-btn {
      background-color: transparent;
      color: #e53e3e;
      border: 1px solid #e53e3e;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .delete-btn:hover {
      background-color: #e53e3e;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 1. 최상단: 책, 장, 절 선택 표시줄 -->
  <header class="top-nav-bar">
    <button class="selector-btn" id="btn-select-book">
      <span id="current-book">창세기</span> ▾
    </button>
    <button class="selector-btn" id="btn-select-chapter">
      <span id="current-chapter">1장</span> ▾
    </button>
    <button class="selector-btn" id="btn-select-verse">
      <span id="current-verse">1절</span> ▾
    </button>
  </header>

  <!-- 2~6. 하단 작업표시줄 -->
  <nav class="toolbar">
    <!-- 다크모드 / 데이모드 토글 버튼 (아이콘) -->
    <button class="tool-btn" id="btn-theme" title="화면 모드 전환">
      <svg id="icon-sun" viewBox="0 0 24 24" style="display: none;">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg id="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <!-- AI 버튼 (심플 아이콘) -->
    <button class="tool-btn" id="btn-ai" title="AI 어시스턴트">
      <svg viewBox="0 0 24 24">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
      </svg>
    </button>

    <!-- 세팅 버튼 (역본 삭제 메뉴 포함) -->
    <button class="tool-btn" id="btn-settings" title="설정 (역본 관리)">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- + 버튼 (역본 추가 설치) -->
    <button class="tool-btn" id="btn-add-version" title="역본 추가 설치">
      <svg viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </nav>

  <!-- 본문 컨테이너 -->
  <main class="content-area" id="bible-content">
    <div class="verse-item"><span class="verse-num">1</span>태초에 하나님이 천지를 창조하시니라</div>
    <div class="verse-item"><span class="verse-num">2</span>땅이 혼돈하고 공허하며 흑암이 깊음 위에 있고 하나님의 영은 수면 위에 운행하시니라</div>
    <div class="verse-item"><span class="verse-num">3</span>하나님이 이르시되 빛이 있으라 하시니 빛이 있었고</div>
  </main>

  <!-- 공통 모달 -->
  <div class="modal-overlay" id="modal-container">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-title">선택</span>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    // 성경 66권 목록 정의
    const bibleBooks = [
      "창세기", "출애굽기", "레위기", "민수기", "신명기", "여호수아", "사사기", "룻기",
      "사무엘상", "사무엘하", "열왕기상", "열왕기하", "역대상", "역대하", "에스라", "느헤미야",
      "에스더", "욥기", "시편", "잠언", "전도서", "아가", "이사야", "예레미야",
      "예레미야애가", "에스겔", "다니엘", "호세아", "요엘", "아모스", "오바댜", "요나",
      "미가", "나훔", "하박국", "스바냐", "학개", "스가랴", "말라기",
      "마태복음", "마가복음", "누가복음", "요한복음", "사도행전", "로마서", "고린도전서", "고린도후서",
      "갈라디아서", "에베소서", "빌립보서", "골로새서", "데살로니가전서", "데살로니가후서", "디모데전서", "디모데후서",
      "디도서", "빌레몬서", "히브리서", "야고보서", "베드로전서", "베드로후서", "요한일서", "요한이서",
      "요한삼서", "유다서", "요한계시록"
    ];

    let installedVersions = ["개역개정", "새번역", "NIV", "ESV"];

    // 모달 제어
    const modal = document.getElementById("modal-container");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");
    const modalClose = document.getElementById("modal-close");

    function openModal(title, contentElement) {
      modalTitle.textContent = title;
      modalBody.innerHTML = "";
      modalBody.appendChild(contentElement);
      modal.classList.add("active");
    }

    modalClose.onclick = () => modal.classList.remove("active");
    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.remove("active");
    };

    // 1. 책 목록 모달
    document.getElementById("btn-select-book").onclick = () => {
      const container = document.createElement("div");
      container.className = "book-list";
      bibleBooks.forEach(book => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.textContent = book;
        btn.onclick = () => {
          document.getElementById("current-book").textContent = book;
          document.getElementById("current-chapter").textContent = "1장";
          document.getElementById("current-verse").textContent = "1절";
          modal.classList.remove("active");
        };
        container.appendChild(btn);
      });
      openModal("성경 목록 선택", container);
    };

    // 1. 장 목록 모달 (예시: 50장)
    document.getElementById("btn-select-chapter").onclick = () => {
      const container = document.createElement("div");
      container.className = "grid-list";
      for (let i = 1; i <= 50; i++) {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.textContent = `${i}장`;
        btn.onclick = () => {
          document.getElementById("current-chapter").textContent = `${i}장`;
          document.getElementById("current-verse").textContent = "1절";
          modal.classList.remove("active");
        };
        container.appendChild(btn);
      }
      openModal("장 선택", container);
    };

    // 1. 절 목록 모달 (예시: 30절)
    document.getElementById("btn-select-verse").onclick = () => {
      const container = document.createElement("div");
      container.className = "grid-list";
      for (let i = 1; i <= 30; i++) {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.textContent = `${i}절`;
        btn.onclick = () => {
          document.getElementById("current-verse").textContent = `${i}절`;
          modal.classList.remove("active");
        };
        container.appendChild(btn);
      }
      openModal("절 선택", container);
    };

    // 3. 테마 전환 (다크/라이트)
    const btnTheme = document.getElementById("btn-theme");
    const iconSun = document.getElementById("icon-sun");
    const iconMoon = document.getElementById("icon-moon");

    btnTheme.onclick = () => {
      const currentTheme = document.body.getAttribute("data-theme");
      if (currentTheme === "dark") {
        document.body.removeAttribute("data-theme");
        iconSun.style.display = "none";
        iconMoon.style.display = "block";
      } else {
        document.body.setAttribute("data-theme", "dark");
        iconSun.style.display = "block";
        iconMoon.style.display = "none";
      }
    };

    // 4. AI 버튼
    document.getElementById("btn-ai").onclick = () => {
      const container = document.createElement("div");
      container.innerHTML = `
        <p style="margin-bottom: 12px; color: var(--text-color);">본문 관련 질문을 입력하거나 요약/주석을 요청할 수 있습니다.</p>
        <textarea style="width: 100%; height: 80px; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color);" placeholder="질문을 입력하세요..."></textarea>
      `;
      openModal("AI 어시스턴트", container);
    };

    // 5. 설정 버튼 (역본 삭제 관리)
    document.getElementById("btn-settings").onclick = renderSettingsModal;

    function renderSettingsModal() {
      const container = document.createElement("div");
      const title = document.createElement("h4");
      title.textContent = "설치된 역본 관리";
      title.style.marginBottom = "10px";
      container.appendChild(title);

      installedVersions.forEach((ver, index) => {
        const item = document.createElement("div");
        item.className = "version-item";
        item.innerHTML = `
          <span>${ver}</span>
          <button class="delete-btn" data-index="${index}">삭제</button>
        `;
        container.appendChild(item);
      });

      container.querySelectorAll(".delete-btn").forEach(btn => {
        btn.onclick = (e) => {
          const idx = e.target.getAttribute("data-index");
          installedVersions.splice(idx, 1);
          renderSettingsModal();
        };
      });

      openModal("설정", container);
    }

    // 6. + 버튼 (역본 추가 설치)
    document.getElementById("btn-add-version").onclick = () => {
      const container = document.createElement("div");
      container.innerHTML = `
        <p style="margin-bottom: 12px;">추가할 역본 명칭을 입력하세요.</p>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="new-version-name" placeholder="예: 공동번역, KJV" style="flex: 1; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-color); color: var(--text-color);" />
          <button id="btn-save-version" style="padding: 8px 16px; background: #2b6cb0; color: #fff; border: none; border-radius: 4px; cursor: pointer;">설치</button>
        </div>
      `;
      openModal("역본 추가 설치", container);

      document.getElementById("btn-save-version").onclick = () => {
        const input = document.getElementById("new-version-name");
        if (input.value.trim()) {
          installedVersions.push(input.value.trim());
          modal.classList.remove("active");
        }
      };
    };
  </script>
</body>
</html>
